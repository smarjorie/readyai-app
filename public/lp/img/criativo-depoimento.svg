    <clipPath id="av"><circle cx="112" cy="100" r="54"/></clipPath>
    <path id="star" d="M0-8l2.35 4.76 5.26.77-3.8 3.7.9 5.24L0 3.99l-4.7 2.48.9-5.24-3.8-3.7 5.26-.77z"/>
  </defs>
  <rect width="480" height="200" fill="url(#bg)"/>
  <circle cx="440" cy="20" r="70" fill="#fff" opacity=".12"/>
  <circle cx="30" cy="190" r="60" fill="#fff" opacity=".1"/>
  <!-- cliente -->
  <circle cx="112" cy="100" r="58" fill="#fff" opacity=".28"/>
