    <text x="16" y="56" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#ff5f86">“</text>
    <g fill="#ffb020"><use href="#star" x="64" y="28"/><use href="#star" x="84" y="28"/><use href="#star" x="104" y="28"/><use href="#star" x="124" y="28"/><use href="#star" x="144" y="28"/></g>
    <rect x="22" y="58" width="208" height="10" rx="5" fill="#ece6ef"/>
    <rect x="22" y="76" width="176" height="10" rx="5" fill="#ece6ef"/>
    <rect x="22" y="98" width="86" height="12" rx="6" fill="#ffd2dc"/>
