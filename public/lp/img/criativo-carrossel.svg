<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-label="Anúncio em carrossel com três produtos de verão">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8bdcff"/><stop offset="1" stop-color="#3b7bff"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2a7a" flood-opacity=".25"/></filter>
  </defs>
  <rect width="480" height="200" fill="url(#bg)"/>
  <circle cx="420" cy="38" r="46" fill="#ffe27a"/>
  <circle cx="420" cy="38" r="62" fill="#ffe27a" opacity=".25"/>
  <path d="M0 168c40-12 80-12 120 0s80 12 120 0 80-12 120 0 80 12 120 0v32H0z" fill="#fff" opacity=".25"/>
  <path d="M0 182c40-10 80-10 120 0s80 10 120 0 80-10 120 0 80 10 120 0v18H0z" fill="#fff" opacity=".35"/>
  <!-- card 1: óculos -->
  <g transform="translate(34 46)" filter="url(#sh)">
    <rect width="118" height="112" rx="16" fill="#fff"/>
    <g fill="#0e1a33"><rect x="22" y="34" width="32" height="22" rx="11"/><rect x="64" y="34" width="32" height="22" rx="11"/></g>
    <path d="M54 42c3-3 7-3 10 0" fill="none" stroke="#0e1a33" stroke-width="3" stroke-linecap="round"/>
    <rect x="26" y="38" width="10" height="4" rx="2" fill="#5b8dff" opacity=".7"/>
    <rect x="22" y="78" width="54" height="8" rx="4" fill="#dfe8f7"/>
    <rect x="22" y="92" width="34" height="10" rx="5" fill="#1e6bff"/>
  </g>
  <!-- card 2: camiseta (em destaque) -->
  <g transform="translate(176 34)" filter="url(#sh)">
    <rect width="128" height="128" rx="18" fill="#fff"/>
    <path d="M44 26l-22 12 8 18 10-4v44h48V52l10 4 8-18-22-12c-3 7-10 11-20 11s-17-4-20-11z" fill="#ff8a5b"/>
    <path d="M44 26c3 7 10 11 20 11s17-4 20-11" fill="none" stroke="#e8673a" stroke-width="3"/>
    <rect x="24" y="104" width="44" height="10" rx="5" fill="#1e6bff"/>
    <rect x="76" y="106" width="28" height="6" rx="3" fill="#dfe8f7"/>
  </g>
  <!-- card 3: protetor solar -->
  <g transform="translate(328 46)" filter="url(#sh)">
    <rect width="118" height="112" rx="16" fill="#fff"/>
    <rect x="44" y="16" width="30" height="12" rx="4" fill="#ffb020"/>
    <rect x="38" y="26" width="42" height="46" rx="10" fill="#ffd34d"/>
    <circle cx="59" cy="49" r="9" fill="#fff"/>
    <rect x="22" y="78" width="54" height="8" rx="4" fill="#dfe8f7"/>
    <rect x="22" y="92" width="34" height="10" rx="5" fill="#1e6bff"/>
  </g>
  <!-- navegação do carrossel -->
  <circle cx="458" cy="104" r="15" fill="#fff"/>
  <path d="M454 97l7 7-7 7" fill="none" stroke="#1e6bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff"><circle cx="226" cy="182" r="4"/><circle cx="240" cy="182" r="4" opacity=".55"/><circle cx="254" cy="182" r="4" opacity=".55"/></g>
</svg>
