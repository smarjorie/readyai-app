<style>
/* Layout: app shell = sidebar | dados | copilot. Na home o copilot ocupa o centro e os insights ficam ao lado. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb; --line:#e6e8ec; --line-2:#d5d9e0;
  --ink:#111827; --muted:#6b7280; --muted-2:#4b5563;
  --accent:#1e6bff; --accent-ink:#1557e0; --accent-soft:#eaf1ff; --on-accent:#ffffff;
  --good:#15803d; --good-soft:#e7f6ec; --warn:#b45309; --warn-soft:#fef3e2;
  --bad:#b91c1c; --bad-soft:#fdecec; --on-bad:#ffffff; --on-good:#ffffff; --violet:#6d28d9; --violet-soft:#f1ecfe;
  --c-meta:#1e6bff; --c-google:#e0730f; --c-tiktok:#0f9488; --c-spend:#9aa3b1; --c-linkedin:#0a66c2; --c-pinterest:#d0263a; --c-kwai:#e5a000;
  --btn:#111827; --btn-hover:#2a3140; --btn-ink:#ffffff;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 8px 24px rgba(17,24,39,.06);
  --overlay:rgba(17,24,39,.32);
  --f-body:"Hanken Grotesk",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
/* Tema claro é o padrão; o escuro só entra quando a pessoa escolhe no botão de tema */
:root.rdy-dark{
  --bg:#0e1116; --surface:#161a21; --surface-2:#1b2029; --line:#262c36; --line-2:#343b47;
  --ink:#e8eaee; --muted:#9aa3b1; --muted-2:#b7bec9;
  --accent:#5b8dff; --accent-ink:#8fb0ff; --accent-soft:#1a2540; --on-accent:#0b1020;
  --good:#4ade80; --good-soft:#11251a; --warn:#fbbf24; --warn-soft:#2a2010;
  --bad:#f87171; --bad-soft:#2c1517; --on-bad:#1a0b0b; --on-good:#06180d; --violet:#a78bfa; --violet-soft:#221a38;
  --c-meta:#5b8dff; --c-google:#f59e3b; --c-tiktok:#2dd4bf; --c-spend:#5d6675; --c-linkedin:#5aa2e8; --c-pinterest:#f06a78; --c-kwai:#f5c242;
  --btn:#e8eaee; --btn-hover:#ffffff; --btn-ink:#0e1116;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.015em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.02em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#root{height:100%}
.boot{display:grid;place-items:center;height:100%;color:var(--muted)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn-primary{background:var(--btn);color:var(--btn-ink)}
.btn-primary:hover{background:var(--btn-hover)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:hover{filter:brightness(1.07)}
.btn-ghost{color:var(--muted-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-line{border:1px solid var(--line-2);background:var(--surface)}
.btn-line:hover{background:var(--surface-2)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted-2)}
.input{height:40px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:0 12px;outline:none;width:100%;min-width:0}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.input{padding-right:28px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill-good{background:var(--good-soft);color:var(--good)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-bad{background:var(--bad-soft);color:var(--bad)}
.pill-info{background:var(--accent-soft);color:var(--accent-ink)}
.pill-violet{background:var(--violet-soft);color:var(--violet)}
.pill-mute{background:var(--surface-2);color:var(--muted-2);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.ch-dot{width:8px;height:8px;border-radius:3px;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card-pad{padding:18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:650;font-weight:600}
.card-sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface)}
.login-side{background-color:var(--surface-2);background-image:radial-gradient(circle at 12% 8%,var(--accent-soft),transparent 46%),radial-gradient(var(--line-2) 1px,transparent 1.2px);background-size:100% 100%,20px 20px;color:var(--ink);padding-block:48px;padding-left:max(clamp(32px,6vw,112px),env(safe-area-inset-left,0px));padding-right:clamp(32px,6vw,112px);display:flex;flex-direction:column;position:relative;overflow:hidden;border-right:1px solid var(--line)}
.login-side h1{font-size:42px;line-height:1.06;font-weight:700;max-width:17ch;letter-spacing:-.025em}
.login-side h1 em{font-style:normal;color:var(--accent)}
.login-side .lead{color:var(--muted-2);max-width:48ch;font-size:15.5px;margin-top:14px}
.ch-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ch-chips > span{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted-2)}
.login-inner{width:100%;max-width:600px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:34px}
.stage{position:relative;max-width:600px;width:100%}
.stage .card{box-shadow:var(--shadow)}
.st-main{position:relative;z-index:1;width:88%;margin:34px auto 104px 4%;padding:18px 18px 26px;display:flex;flex-direction:column;gap:12px}
.st-float{position:absolute;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);font-size:12.5px}
.st-alert{top:0;right:0;display:flex;align-items:center;gap:8px;padding:9px 12px;animation:floaty 6s ease-in-out infinite}
.st-report{left:0;bottom:6px;width:236px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;animation:floaty 6.5s ease-in-out 1.2s infinite}
.st-report .ok{width:26px;height:26px;border-radius:8px;background:var(--good-soft);color:var(--good);display:grid;place-items:center;flex:none}
.st-report small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.st-report .chs{display:flex;gap:4px;margin-top:6px;flex-wrap:nowrap}
.st-report .chs span{white-space:nowrap;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted-2)}
.st-chat{right:0;bottom:0;width:290px;padding:12px 14px;display:flex;gap:10px;font-size:13px;line-height:1.45;animation:floaty 7s ease-in-out .6s infinite reverse}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.trust{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:auto;font-size:12.5px;color:var(--muted)}
.trust span{display:inline-flex;align-items:center;gap:6px}
.login-main{display:flex;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.pass-wrap{position:relative}
.pass-wrap .input{padding-right:44px}
.pass-eye{position:absolute;top:50%;right:4px;transform:translateY(-50%);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.pass-eye:hover{color:var(--ink);background:var(--surface-2)}
.login-box h2{font-size:24px;font-weight:700}
.demo-creds{border:1px dashed var(--line-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cred{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:9px;background:var(--surface-2);text-align:left;width:100%}
.cred:hover{background:var(--accent-soft)}
.cred small{display:block;color:var(--muted);font-size:12px}
.err{color:var(--bad);background:var(--bad-soft);padding:9px 12px;border-radius:10px;font-size:13px}
@media (max-width:1180px){.stage{display:flex;flex-direction:column;gap:10px}.st-main{width:100%;margin:0}.st-float{position:static;width:auto;animation:none}}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-side{padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}.login-side h1{font-size:30px}.stage,.trust{display:none}}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;color:var(--muted-2);font-weight:550;font-weight:500;font-size:13.5px;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav-item.accent{color:var(--ink);font-weight:600}
.nav-item.accent .ico-wrap{background:var(--accent);color:var(--on-accent)}
.ico-wrap{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.nav-sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 21px;padding-left:10px;border-left:1px solid var(--line)}
.nav-sub button{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:13px;text-align:left}
.nav-sub button:hover{color:var(--ink);background:var(--surface-2)}
.nav-sub button.on{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.who{display:flex;align-items:center;gap:10px;padding:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who b{font-size:13px;display:block;line-height:1.2}
.who small{font-size:11.5px;color:var(--muted)}
.who b,.who small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{gap:8px;padding:8px 4px}
.who .btn-sm{padding:0 6px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);min-height:60px}
.crumb{display:flex;align-items:center;gap:8px;min-width:0}
.crumb span{color:var(--muted);font-size:13px;white-space:nowrap}
.crumb b{font-size:15px;font-weight:650;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px}
.chip-sel{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:9px;font-size:13px;background:var(--surface);white-space:nowrap}
.menu-btn{display:none}
@media (max-width:1180px){.hide-md{display:none!important}}
.imp-banner{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:7px 16px;background:var(--violet-soft);color:var(--violet);font-size:13px;font-weight:600;text-align:center}
.imp-banner button{text-decoration:underline;font-weight:700}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.work.no-dock{grid-template-columns:minmax(0,1fr)}
.work.home{grid-template-columns:minmax(0,1fr) 420px}
.pane{overflow-y:auto;min-width:0;padding:22px 24px 40px}
.dock{border-left:1px solid var(--line);background:var(--surface);min-height:0;display:flex;flex-direction:column}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:24px;font-weight:700}
.page-head p{color:var(--muted);font-size:14px;margin-top:4px;max-width:64ch}
.demo-note{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1280px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}

.kpi{padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi-l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi-v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--good)} .down{color:var(--bad)}

.tbl-wrap{overflow-x:auto;margin:0 -18px -18px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;letter-spacing:.02em}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--muted-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td:first-child,.tbl th:first-child{padding-left:18px}
.tbl td:last-child,.tbl th:last-child{padding-right:18px}
.tbl tbody tr:hover td{background:var(--surface-2)}
.cname{color:var(--ink);font-weight:600;max-width:320px;overflow:hidden;text-overflow:ellipsis;display:block}

.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:13px}
.bar-track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:99px}

.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.toggle{position:relative;width:36px;height:20px;border-radius:20px;background:var(--line-2);transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(16px)}
.toggle[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;min-height:0;height:100%}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chat-head b{font-size:14px;display:flex;align-items:center;gap:8px}
.ctx{font-size:11.5px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{max-width:92%;font-size:13.5px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--bg);padding:9px 13px;border-radius:14px 14px 4px 14px}
.msg.bot{align-self:flex-start;display:flex;gap:10px}
.bot-ico{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;margin-top:1px}
.bot-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.bot-body p{color:var(--ink)}
.bot-body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.mini-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.mini{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface-2)}
.mini small{display:block;font-size:11.5px;color:var(--muted)}
.mini b{font-size:16px;font-weight:700}
.msg-actions{display:flex;gap:6px;flex-wrap:wrap}
.confirm-box{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.sug{font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted-2);text-align:left}
.sug:hover{border-color:var(--accent);color:var(--accent-ink)}
.composer{padding:10px 12px 12px;border-top:1px solid var(--line)}
.composer form{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line-2);border-radius:14px;padding:6px 6px 6px 12px;background:var(--surface)}
.composer form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{flex:1;border:0;outline:none;resize:none;background:transparent;min-height:24px;max-height:120px;padding:6px 0;font-size:14px;min-width:0}
.send{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.4}

/* home copilot */
.home-chat{display:flex;flex-direction:column;min-height:0;height:100%;background:var(--bg)}
.home-chat .msgs{padding:24px max(24px,4%)}
.home-chat .composer{border-top:0;padding:8px max(24px,4%) 20px}
.home-chat .composer form{box-shadow:var(--shadow);padding:8px 8px 8px 16px}
.home-chat .sugs{padding:0 max(24px,4%) 8px}
.hello{padding:28px max(24px,4%) 6px}
.hello h1{font-size:30px;font-weight:700;line-height:1.15;max-width:30ch}
.hello p{color:var(--muted);margin-top:8px;font-size:14.5px}
.hello .badge-co{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:4px 10px;border-radius:999px;margin-bottom:14px}
.insights-pane{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:18px 18px 32px;display:flex;flex-direction:column;gap:16px}
.health{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.ins{border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px 16px;position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ins::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--sev)}
.ins h3{font-size:13.5px;font-weight:650;font-weight:600;line-height:1.35}
.ins p{font-size:12.5px;color:var(--muted-2);line-height:1.5}
.ins-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ins-acts{display:flex;gap:6px;flex-wrap:wrap}
.link-btn{font-size:12.5px;font-weight:600;color:var(--accent-ink);display:inline-flex;align-items:center;gap:4px;padding:4px 0}
.link-btn:hover{text-decoration:underline}
.mini-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-kpis div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini-kpis small{font-size:11.5px;color:var(--muted);display:block}
.mini-kpis b{font-size:18px;font-weight:700;letter-spacing:-.01em}

/* creatives */
.cre{overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/10;max-width:100%;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff}
.thumb .fmt{align-self:flex-start;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.thumb .hl{font-size:15px;font-weight:700;line-height:1.15;text-shadow:0 1px 8px rgba(0,0,0,.25);max-width:14ch}
.thumb .fmt,.thumb .hl{position:relative;z-index:1}
.thumb::after{content:"";position:absolute;inset:45% 0 0 0;background:linear-gradient(to top,rgba(0,0,0,.38),transparent);pointer-events:none}
.thumb .hl{z-index:2}
.cre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cre-body{padding:10px 12px 12px!important;gap:8px!important}
.client-switch{cursor:pointer;background:var(--surface)}
.switcher{position:relative}
.sw-pop{position:absolute;right:0;top:calc(100% + 6px);width:320px;max-width:calc(100vw - 32px);max-height:440px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:50;display:flex;flex-direction:column;gap:2px}
.sw-pop .input{height:36px;margin-bottom:4px}
.sw-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;text-align:left;width:100%}
.sw-item:hover{background:var(--surface-2)}
.sw-item.on{background:var(--accent-soft)}
.sw-item b{display:block;font-size:13.5px;font-weight:600}
.sw-item small{display:block;font-size:11.5px;color:var(--muted)}
.sw-sep{height:1px;background:var(--line);margin:4px 2px}
.c-av{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.c-av.sm{width:22px;height:22px;border-radius:6px;font-size:11px}
.hdot{width:8px;height:8px;border-radius:50%;flex:none}
.hdot.good{background:var(--good)}.hdot.warn{background:var(--warn)}.hdot.bad{background:var(--bad)}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.client-card{margin:0 0 10px;padding:10px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);display:flex;flex-direction:column;gap:8px}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent-ink);align-self:flex-start}
.back-link svg{transform:rotate(180deg)}
.client-band{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(20px,env(safe-area-inset-right,0px)) 8px 20px;background:var(--accent-soft);border-bottom:1px solid color-mix(in srgb,var(--accent) 25%,transparent);font-size:13px;color:var(--ink)}
.band-accs{display:flex;gap:6px;flex-wrap:wrap}
.band-note{color:var(--muted-2);font-size:12px;margin-left:auto}
.client-band .btn{margin-left:auto}
.band-note+.btn{margin-left:0}
.crumb-link{color:var(--muted);font-size:13px}
.crumb-link:hover{color:var(--accent-ink);text-decoration:underline}
.crumb-client{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;white-space:nowrap}
.acc-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted-2);position:relative;white-space:nowrap}
.acc-alert{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
.acc-btn{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted)}
.acc-list{display:flex;flex-direction:column;gap:6px;padding:2px 0}
.acc-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;white-space:normal}
.pend{display:inline-flex;gap:4px;flex-wrap:wrap}
.pend .pill{height:22px;padding:0 7px}
.ops{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1380px){.ops{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.ops{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.op{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 14px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.op::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--sev)}
.op:hover{border-color:var(--sev)}
.op.on{border-color:var(--sev);box-shadow:0 0 0 2px color-mix(in srgb,var(--sev) 30%,transparent)}
.op-top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted-2)}
.op-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--sev);background:color-mix(in srgb,var(--sev) 12%,transparent)}
.op-n{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.op-n small{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.op-d{font-size:12px;color:var(--muted);line-height:1.35}
.queue{padding:4px 0 6px;overflow:hidden}
.queue-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 18px 10px}
.q-row{display:grid;grid-template-columns:22px 148px 150px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 18px;border-top:1px solid var(--line);font-size:13px;position:relative}
.q-row::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--sev)}
.q-row.done{opacity:.5}
.q-row.done .q-text{text-decoration:line-through}
.q-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--accent-ink)}
.q-more:hover{background:var(--surface-2)}
.q-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--on-good)}
.q-check.on{background:var(--good);border-color:var(--good)}
.q-client{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-text{display:flex;align-items:center;gap:7px;color:var(--muted-2);min-width:0}
.q-acts{justify-self:end}
@media (max-width:900px){.q-row{grid-template-columns:22px minmax(0,1fr) auto;row-gap:4px}.q-row .pill{grid-column:2}.q-client{grid-column:2}.q-text{grid-column:2}.q-acts{grid-column:3;grid-row:1}}
.client-switch{cursor:pointer}
.client-switch:hover{border-color:var(--accent);color:var(--accent-ink)}
.view-seg button{display:grid;place-items:center;width:34px;padding:0}
.cre-list{overflow:hidden}
.cre-row{display:grid;grid-template-columns:52px minmax(0,1fr) 126px 116px 64px 92px 104px;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted-2)}
.cre-meta{display:flex;gap:8px;align-items:center;margin-top:2px;min-width:0}.cre-meta>span:last-child{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.th-sort{font:inherit;color:inherit;background:none;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:3px;letter-spacing:inherit;text-align:left}
.th-sort.r{justify-content:flex-end;text-align:right}.th-sort:hover,.th-sort.on{color:var(--ink)}
.th-arr{display:grid}.th-arr.up{transform:rotate(180deg)}
.cre-tools{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.cre-tools-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cre-search{flex:1 1 240px;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:10px;color:var(--muted);background:var(--surface)}
.cre-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cre-search input{flex:1;border:0;outline:none;background:none;font:inherit;font-size:13.5px;color:var(--ink);min-width:0}
.cre-search button{display:grid;color:var(--muted);padding:2px}
.cre-sel{height:36px;width:auto;max-width:220px;font-size:13px}
.cre-sel-camp{max-width:260px}
.cre-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.cre-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-weight:600;color:var(--muted-2);background:var(--surface);cursor:pointer}
.cre-chip:hover{border-color:var(--line-2);color:var(--ink)}
.cre-chip span{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface-2);border-radius:99px;padding:1px 7px}
.cre-chip i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.cre-chip.c-good i{background:var(--good)}.cre-chip.c-warn i{background:var(--warn)}.cre-chip.c-bad i{background:var(--bad)}
.cre-chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cre-chip.on span{background:rgba(255,255,255,.18);color:var(--surface)}
.cre-count{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.cre-row:last-child{border-bottom:0}
.cre-row:not(.cre-row-head):hover{background:var(--surface-2)}
.cre-row .r{text-align:right}
.cre-row-head{font-size:11.5px;font-weight:600;color:var(--muted);padding-top:12px;padding-bottom:10px;letter-spacing:.02em}
.mini-thumb{position:relative;width:52px;height:52px;border-radius:10px;overflow:hidden;display:block}
@media (max-width:760px){.cre-row{grid-template-columns:52px minmax(0,1fr) 88px}.cre-row>:nth-child(3),.cre-row>:nth-child(5),.cre-row>:nth-child(6),.cre-row>:nth-child(7){display:none}}
.cre-art{position:absolute;inset:0;width:100%;height:100%;display:block}
.btn-danger{background:var(--bad);color:var(--on-bad)}
.btn-danger:hover{filter:brightness(1.08)}
.btn-good{background:var(--good);color:var(--on-good)}
.btn-good:hover{filter:brightness(1.08)}
.roasbar{position:relative;display:inline-block;width:84px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);flex:none}
.roasbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.roasbar u{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}
.rec-why{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;white-space:normal;max-width:180px;line-height:1.35}
.camp-tbl tr.off td{color:var(--muted)}
.camp-tbl tr.off .cname{color:var(--muted-2)}
.confirm-row td{background:var(--surface-2)!important;padding-top:8px;padding-bottom:10px}
.confirm-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink)}
.rec-card{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;background:linear-gradient(90deg,var(--accent-soft),var(--surface) 70%)}
.rec-head{display:flex;gap:10px;align-items:flex-start;min-width:0;flex:1 1 320px}
.rec-head b{font-size:14px}
.rec-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rec-chips .pill{height:30px;padding:0 12px;font-size:12.5px;cursor:pointer;border:1px solid transparent}
.rec-chips .pill.sel{border-color:currentColor;box-shadow:0 0 0 2px var(--surface) inset}
.rec-chips .cnt{background:var(--surface);color:var(--ink);border-radius:99px;padding:0 6px;font-size:11px;line-height:17px;margin-left:2px}
.cre-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.cre-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cre-stats small{display:block;font-size:11px;color:var(--muted)}
.cre-stats b{font-size:14px}

/* admin */
.admin{min-height:100%;display:flex;flex-direction:column}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.admin-body{padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));max-width:1240px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.drawer-bg{position:fixed;inset:0;background:var(--overlay);z-index:40;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px max(20px,env(safe-area-inset-right,0px)) 14px 20px;border-bottom:1px solid var(--line);padding-top:max(18px,env(safe-area-inset-top,0px))}
.drawer-body{flex:1;overflow-y:auto;padding:18px max(20px,env(safe-area-inset-right,0px)) 18px 20px;display:flex;flex-direction:column;gap:18px}
.drawer-foot{padding:12px max(20px,env(safe-area-inset-right,0px)) 12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.mod-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mod-row:last-child{border-bottom:0}
.mod-row b{font-size:13.5px;font-weight:600;display:block}
.mod-row small{font-size:12px;color:var(--muted)}
.plan-card{display:flex;flex-direction:column;gap:12px;padding:18px}
.plan-card .price{font-size:28px;font-weight:700;letter-spacing:-.02em}
.plan-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px}
.plan-card li{display:flex;gap:8px;align-items:center}
.plan-card li.off{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.secret{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--good-soft);color:var(--good);font-size:13px;flex-wrap:wrap}
.secret code{font-family:var(--f-mono);font-size:13px;user-select:all;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:60;box-shadow:var(--shadow);animation:fade .2s;max-width:calc(100% - 32px)}
.fab{display:none;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;height:46px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--on-accent);align-items:center;gap:8px;font-weight:600;box-shadow:var(--shadow)}
.fab.show{display:inline-flex}
.dock-toggle.on{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.locked{max-width:520px;margin:40px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 24px}
.lock-ico{width:52px;height:52px;border-radius:16px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center}

/* responsive shell */
@media (max-width:1180px){
  .work,.work.home{grid-template-columns:minmax(0,1fr)}
  .dock{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:41;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px);padding-top:env(safe-area-inset-top,0px)}
  .dock.open{transform:none}
  .fab{display:inline-flex}
  .work.home{display:flex;flex-direction:column;overflow-y:auto}
  .work.home .home-chat{height:auto;flex:none;min-height:auto}
  .work.home .insights-pane{flex:none}
  .work.home .insights-pane{border-left:0;border-top:1px solid var(--line);overflow:visible}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:42;transform:translateX(-105%);transition:transform .2s;padding-top:max(14px,env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px))}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .pane{padding:18px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
  .hide-sm{display:none!important}
  .hello h1{font-size:24px}
}

/* ---------- dados reais ---------- */
.data-band{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px max(20px,env(safe-area-inset-right,0px)) 9px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--muted-2)}
.data-band.demo{background:var(--warn-soft);color:var(--ink)}
.data-band.demo svg{color:var(--warn)}
.data-band.err{background:var(--bad-soft);color:var(--ink)}
.data-band.err svg{color:var(--bad)}
.data-band.live{background:var(--surface)}
.band-src{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.band-err{color:var(--bad);font-weight:600;flex:1;min-width:200px}
.data-band .band-note{flex:1}
.data-band.live .btn{margin-left:auto}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px;counter-reset:st}
.steps>li{position:relative;padding-left:36px;counter-increment:st;color:var(--muted)}
.steps>li::before{content:counter(st);position:absolute;left:0;top:-1px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted-2)}
.steps>li.on,.steps>li.done{color:var(--ink)}
.steps>li.on::before{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps>li.done::before{content:"✓";background:var(--good-soft);border-color:var(--good);color:var(--good)}
.steps>li>b{font-size:14px}
.help{margin-top:10px;font-size:12.5px;color:var(--muted-2)}
.help summary{cursor:pointer;font-weight:600;color:var(--accent-ink)}
.help p{margin-top:8px;line-height:1.55}
.help a{color:var(--accent-ink);font-weight:600}
.acc-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.acc-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;background:var(--surface)}
.acc-opt:hover{background:var(--surface-2)}
.acc-opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.acc-opt b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-opt .mono{color:var(--muted)}
.acc-opt input{accent-color:var(--accent);flex:none}
.ac{position:relative}
.ac-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);cursor:pointer;color:var(--ink)}
.ac-btn:hover{border-color:var(--muted)}
.ac.open .ac-btn,.ac-btn:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.ac-btn>svg:last-child{color:var(--muted);flex:none;transition:transform .15s}
.ac.open .ac-btn>svg:last-child{transform:rotate(180deg)}
.ac-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.ac-main b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-main .mono{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-ph{color:var(--muted);font-weight:500}
.ac-pop{margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 10px 30px rgba(17,24,39,.12);overflow:hidden}
.ac-search{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);color:var(--muted)}
.ac-search input{flex:1;border:0;background:transparent;height:42px;font:inherit;font-size:13.5px;color:var(--ink);outline:none;min-width:0}
.ac-list{max-height:300px;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.ac-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink)}
.ac-opt.hi{background:var(--surface-2)}
.ac-opt.on .ac-main b{color:var(--accent-ink)}
.ac-check{width:16px;flex:none;color:var(--accent);display:grid;place-items:center}
.ac-empty{padding:14px 10px;font-size:13px;color:var(--muted);text-align:center}
.auth-link{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13px}

.wait-card{display:flex;gap:14px;align-items:flex-start;max-width:680px}
.empty{display:flex;gap:18px;align-items:flex-start;padding:26px 28px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 1px 2px rgba(17,24,39,.04)}
.empty-ico{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.empty.bad .empty-ico{background:var(--bad-soft);color:var(--bad)}
.empty.warn .empty-ico{background:var(--warn-soft);color:var(--warn)}
.empty-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.empty-body h2{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.empty-body p{color:var(--muted-2);font-size:14px;max-width:68ch;margin:0}
.empty-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.empty-steps{list-style:none;margin:12px 0 0;padding:14px 0 0;border-top:1px dashed var(--line-2);display:flex;gap:10px 22px;flex-wrap:wrap}
.empty-steps li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-2)}
.empty-steps li span{width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink);flex:none}
.empty-steps li.done span{background:var(--good);border-color:var(--good);color:#fff}
.empty-errs{list-style:none;margin:0;padding:10px 12px;border-radius:10px;background:var(--bad-soft);display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink)}
.empty-errs li{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.ghost{display:flex;flex-direction:column;gap:14px;opacity:.55;pointer-events:none;user-select:none;-webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
.gh-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.gh-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gh-grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.gh-card{border:1px dashed var(--line-2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.gh-card i{display:block;height:9px;border-radius:5px;background:var(--surface-2)}
.gh-card b{display:block;height:22px;width:70%;border-radius:6px;background:var(--surface-2)}
.gh-row{display:flex;gap:16px;padding:6px 0}.gh-row i{flex:1}
.gh-img{aspect-ratio:16/10;border-radius:10px;background:var(--surface-2)}
.gh-bar i{height:12px}
.gh-chart{height:170px;justify-content:flex-end}
.gh-chart svg{width:100%;height:110px}.gh-chart path{fill:none;stroke:var(--line-2);stroke-width:3;stroke-dasharray:6 6;vector-effect:non-scaling-stroke}
.setup{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.setup-step{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.setup-step.done{background:var(--surface-2)}
.setup-n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.setup-step.done .setup-n{background:var(--good);border-color:var(--good);color:#fff}
.setup-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.setup-txt b{font-size:14.5px}.setup-txt span{font-size:13px;color:var(--muted-2)}
.setup-act{display:flex;align-items:center;gap:8px;flex:none}
.setup-preview{gap:12px}
.prev-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px dashed var(--line-2);border-radius:12px}
.prev-item b{display:block;font-size:13.5px}.prev-item small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.prev-item .ico-wrap{width:30px;height:30px;border-radius:9px;background:var(--surface-2);color:var(--muted-2);display:grid;place-items:center;flex:none}
.chip-btn{cursor:pointer}.chip-btn:hover{border-color:var(--accent)}
.chip-btn .ch-dot.off{background:var(--line-2)}
.chip-btn.bad{color:var(--bad);border-color:var(--bad-soft)}
.chip-btn.bad .ch-dot{background:var(--bad)}
@media (max-width:760px){.empty{flex-direction:column;padding:20px}.gh-grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.gh-grid3,.gh-grid2{grid-template-columns:1fr}.gh-grid3>:nth-child(n+2){display:none}.setup-step{flex-wrap:wrap}.setup-act{width:100%;justify-content:flex-end}}
.wait-card b{display:block;font-size:15px}

/* ---------- cadastro, convites e exclusão ---------- */
.notice{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted-2)}
.notice b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
.notice span{line-height:1.5}
.notice>svg{margin-top:2px;flex:none}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.notice.warn>svg{color:var(--warn)}
.notice.info{background:var(--accent-soft);border-color:transparent}
.notice.info>svg{color:var(--accent-ink)}
.notice .msg-actions{align-self:center}
.row-acts{display:inline-flex;align-items:center;gap:2px}
.icon-btn{width:30px;padding:0;justify-content:center}
.icon-btn.danger{color:var(--muted)}
.icon-btn.danger:hover{color:var(--bad);background:var(--bad-soft)}
.confirm-row.del td{background:var(--bad-soft)!important}
.confirm-row.del svg{color:var(--bad);flex:none}
.ppl-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ppl-row>div:nth-child(2){flex:1;min-width:0}
.ppl-row b{display:flex;align-items:center;gap:6px;font-size:13.5px;flex-wrap:wrap}
.ppl-row small{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.ppl-av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;text-transform:uppercase}
.ppl-extra .ppl-av{background:var(--surface-2);color:var(--muted-2)}
.ppl-acts{display:flex;gap:2px;flex:none}
.ppl-acts .btn{padding:0 7px}
.ppl-form{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--accent);border-radius:12px;background:var(--accent-soft)}
.ppl-form .input{background:var(--surface)}
.inv-box{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.inv-box b{display:block;font-size:13.5px;color:var(--ink)}
.inv-box span{color:var(--muted-2);line-height:1.5}
.inv-box>svg{margin-top:2px;flex:none;color:var(--accent-ink)}
.inv-box.good{background:var(--good-soft);border-color:transparent}
.inv-box.good>svg{color:var(--good)}
.inv-box.bad{background:var(--bad-soft);border-color:transparent}
.inv-box.bad>svg{color:var(--bad)}
.danger-zone{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:4px}
.danger-zone p{font-size:13px;color:var(--muted-2);line-height:1.5}
.danger-line{color:var(--bad);border-color:var(--bad)}
.danger-line:hover{background:var(--bad-soft)}

/* ---------- IA conectada ---------- */
.prov-dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.ai-badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink);min-width:0;max-width:240px}
.ai-badge:hover{background:var(--surface-2)}
.ai-badge .mono{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dock .ai-badge{max-width:170px}
.ai-cta{margin:0 16px 16px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.home-chat .ai-cta{margin:0 max(24px,4%) 20px}
.ai-cta b{font-size:14px;display:block}
.ai-cta p{color:var(--muted);font-size:13px;margin:2px 0 12px}
.ai-cta-ico{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.ai-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ai-tabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.ai-tab{border:1px solid var(--line-2);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;background:var(--surface)}

.ai-note{font-size:12.5px;color:var(--muted-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.ai-note svg{margin-top:2px;color:var(--good)}

/* quando a conta converte: períodos do dia + mapa dia da semana x hora */
.tod-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tod-tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tod-tile.top{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tod-tile .t-h{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted-2);font-weight:600}
.tod-tile .t-v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tod-tile .t-s{font-size:12px;color:var(--muted)}
.tod-tile .t-badges{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}

.heat{display:grid;grid-template-columns:38px repeat(24,minmax(0,1fr));gap:3px;align-items:center}

.heat .hx{font-size:10.5px;color:var(--muted);text-align:left;white-space:nowrap}
.heat .sep{grid-column:1/-1;height:4px}
.heat-legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.heat-legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.tod-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stale-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;white-space:nowrap}
@media (max-width:900px){.tod-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.heat{grid-template-columns:30px repeat(24,minmax(0,1fr));gap:2px}.heat .hc{height:16px;border-radius:3px}.heat .hx{font-size:9.5px}}
.thumb img.real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.thumb.noimg{background:linear-gradient(150deg,var(--surface-2),var(--line-2));color:var(--ink)}
.thumb.noimg::after{display:none}
.thumb.noimg .hl{text-shadow:none}
.mini-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.idle-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:320px;overflow:auto}
.idle-list div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:var(--surface-2);font-size:13px}
.idle-list small{color:var(--muted);white-space:nowrap}
/* seletor de período */
.pp{position:relative}
.pp-btn{cursor:pointer;gap:7px}
.pp-btn:hover,.pp-btn.on{border-color:var(--accent);color:var(--ink)}
.pp-btn svg:last-child{color:var(--muted)}
.pp-lbl{font-weight:600}
.pp-dates{color:var(--muted);font-size:12px}
.pp-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:60;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(17,24,39,.18);overflow:hidden;width:max-content;max-width:calc(100vw - 24px)}
.pp-pre{display:flex;flex-direction:column;gap:2px;padding:10px;border-right:1px solid var(--line);background:var(--surface-2);min-width:178px}
.pp-pre button{text-align:left;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink)}

.pp-cal{padding:12px 16px 14px;position:relative;display:flex;flex-direction:column;gap:8px}
.pp-nav{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;pointer-events:none}
.pp-nav button{pointer-events:auto;padding:0 6px}
.pp-nav button:first-child svg{transform:rotate(90deg)}
.pp-nav button.nx svg{transform:rotate(-90deg)}
.pp-months{display:flex;gap:22px}
.cal-m{width:238px}
.cal-title{text-align:center;font-size:13px;font-weight:700;text-transform:capitalize;padding:5px 0 10px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal-wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cal-d{height:32px;font-size:12.5px;color:var(--ink);border-radius:8px;font-variant-numeric:tabular-nums}
.cal-d:hover:not([disabled]){background:var(--surface-2)}

.cal-d.today{box-shadow:inset 0 0 0 1px var(--line-2)}
.cal-d.in{background:var(--accent-soft);border-radius:0;color:var(--accent-ink)}
.cal-d.sel,.cal-d.sel:hover:not([disabled]){background:var(--accent);color:var(--on-accent);font-weight:700}
.cal-d.in:hover:not([disabled]){background:var(--accent-soft)}
.cal-d.sel.lo:not(.hi){border-radius:8px 0 0 8px}
.cal-d.sel.hi:not(.lo){border-radius:0 8px 8px 0}
.pp-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted-2)}
@media (max-width:760px){.pp-m2{display:none}.pp-pop{flex-direction:column;position:fixed;left:12px;right:12px;top:58px;width:auto;max-height:calc(100vh - 72px);overflow:auto}.cal-m{width:100%}.pp-cal{padding:12px}.pp-pre{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);min-width:0}.pp-pre button{flex:1 1 45%}.pp-pre button small{display:none}}
/* aviso de período sem dados */
.data-band.nodata{background:var(--accent-soft);color:var(--ink);align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.nd-ico{width:34px;height:34px;border-radius:10px;background:var(--surface);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.nd-txt{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.nd-txt b{font-size:14px}
.nd-txt span{font-size:12.5px;color:var(--muted-2)}
.nd-acts{display:flex;gap:8px;flex-wrap:wrap}
.nodata-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-color:var(--accent);background:var(--accent-soft)}

/* verba do planejamento */

.bh-main{padding:24px 26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bh-q{font-size:17px;font-weight:650;color:var(--ink)}
.bh-amount{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--line-2);padding-bottom:6px;max-width:420px;transition:border-color .15s}
.bh-amount:focus-within{border-color:var(--accent)}
.bh-amount span{font-size:22px;font-weight:600;color:var(--muted)}
.bh-amount input{border:0;outline:none;background:none;font-size:44px;font-weight:750;letter-spacing:-.03em;width:100%;min-width:0;color:var(--ink);font-variant-numeric:tabular-nums;padding:0}
.bh-ctx{font-size:13px;color:var(--muted-2)}
.bh-ctx .up{color:var(--good);font-weight:600}.bh-ctx .down{color:var(--warn);font-weight:600}

const aiStore = (() => {
  let state = { conn: null, modal: null, owner: null };
  let save = () => {};
  const subs = new Set();
  const emit = () => subs.forEach(f => f());
  const set = patch => { state = { ...state, ...patch }; emit(); };
  return {
    get: () => state,
    subscribe: f => { subs.add(f); return () => subs.delete(f); },
    // liga o store ao cliente aberto; chamado durante a renderização, então não avisa os inscritos
    bind: (owner, conn, saver) => { state = { conn: conn || null, modal: null, owner }; save = saver || (() => {}); },
    reset: () => { state = { conn: null, modal: null, owner: null }; save = () => {}; },
    connect: conn => { set({ conn, modal: null }); save(conn); },
    disconnect: () => { set({ conn: null }); save(null); },
    open: provider => set({ modal: provider || (state.conn && state.conn.provider) || "anthropic" }),
    close: () => set({ modal: null }),
  };
})();

async function aiCall(payload, key) {

  } catch (e) { throw new Error("Sem conexão com o servidor do copilot. Confira sua internet e tente de novo."); }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || (r.status === 404 || r.status === 405 ? "O servidor do copilot (/api/chat) não está disponível. Publique na Vercel ou rode localmente com “vercel dev”." : "Falha ao falar com a IA (" + r.status + ")."));

}

function toAIMessage(m) {
  if (m.role === "user") return { role: "user", content: m.text };
  if (m.kind) return { role: "assistant", content: JSON.stringify({ text: m.kind === "media-ask-budget" ? "Quanto você tem para investir nos próximos 30 dias?" : m.kind === "media-ask-value" ? "Qual o ticket médio e quantas conversas viram venda?" : "Apresentei o plano de mídia (detalhes em plano_de_midia)." }) };
  const o = { text: m.text };
  ["bullets", "cards", "actions"].forEach(k => { if (m[k]) o[k] = m[k]; });
  if (m.confirm) o.confirm = { kind: m.confirm.kind, id: m.confirm.id, value: m.confirm.value, situacao: m.resolved === "ok" ? "confirmada pela pessoa" : m.resolved === "no" ? "descartada pela pessoa" : "aguardando" };
  return { role: "assistant", content: JSON.stringify(o) };
}
function parseAIReply(raw, ctx) {
  const s = String(raw || "").trim();
  let j = null;
  const m = s.match(/\{[\s\S]*\}/);
  if (m) { try { j = JSON.parse(m[0]); } catch (e) {} }
  if (!j || typeof j.text !== "string") return { text: s.replace(/```(json)?/g, "").trim() || "Não consegui gerar uma resposta agora. Tente reformular a pergunta." };
  const str = v => (typeof v === "string" || typeof v === "number") ? String(v).trim() : "";
  const out = { text: j.text.trim() };
  if (Array.isArray(j.bullets)) { const b = j.bullets.map(str).filter(Boolean).slice(0, 6); if (b.length) out.bullets = b; }
  if (Array.isArray(j.cards)) {
    const c = j.cards.map(x => Array.isArray(x) ? [str(x[0]), str(x[1])] : x && typeof x === "object" ? [str(x.label), str(x.value)] : null).filter(x => x && x[0] && x[1]).slice(0, 4);
    if (c.length) out.cards = c;
  }
  if (Array.isArray(j.actions)) {
    const a = j.actions.map(x => {
      if (!x || typeof x !== "object" || !str(x.label)) return null;
      if (x.open && ctx.clientIds.includes(x.open)) return { label: str(x.label), open: x.open, go: ctx.screens.includes(x.goto) ? x.goto : "copilot" };
      if (ctx.screens.includes(x.goto)) return { label: str(x.label), goto: x.goto };
      return null;
    }).filter(Boolean).slice(0, 3);
    if (a.length) out.actions = a;
  }
  const cf = j.confirm;
  if (cf && typeof cf === "object") {
    const c = ctx.camps.find(x => x.id === cf.id);
    if (c) {
      const chl = CH[c.ch].label;
      if (cf.kind === "pause" && c.status === "ativa") out.confirm = { kind: "pause", id: c.id, label: `Pausar “${c.name}” no ${chl}` };
      else if (cf.kind === "activate" && c.status !== "ativa") out.confirm = { kind: "activate", id: c.id, label: `Reativar “${c.name}” no ${chl}` };
      else if (cf.kind === "budget") {
        const v = Math.round(Number(cf.value));
        if (v > 0 && v < 1e6 && v !== c.budget) out.confirm = { kind: "budget", id: c.id, value: v, label: `Alterar o orçamento de “${c.name}” de ${brl(c.budget)} para ${brl(v)}/dia` };
      }
    }
  }
  return out;
}

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function LineChart({ sets, labels, height = 230, fmt = kfmt }) {

  const ticks = [0, .25, .5, .75, 1].map(f => f * max);

// Canais que podem entrar no plano. Os que não estão conectados entram com custo de referência editável.
const MEDIA_CH = {
  meta: { label: "Meta Ads", color: "var(--c-meta)" },
  google: { label: "Google Ads", color: "var(--c-google)" },
  tiktok: { label: "TikTok Ads", color: "var(--c-tiktok)" },
  linkedin: { label: "LinkedIn Ads", color: "var(--c-linkedin)" },

  kwai: { label: "Kwai Ads", color: "var(--c-kwai)" },

// Previsão só com fontes oficiais: o histórico da própria conta (APIs do Meta e do Google).

  const realRpr = all.length ? all.reduce((a, x) => a + x.Rev0, 0) / all.reduce((a, x) => a + x.R0, 0) : null;

  const typedRpr = kind === "compras" ? (numIn(inp.ticket) || 0) : (numIn(inp.targetCpl) || 0);
  const out = [];
  for (const k of Object.keys(MEDIA_CH)) {
    const c = (inp.ch && inp.ch[k]) || {};
    const { hc, S0, R0, Rev0, hist } = base(k);
    // frequência média (ponderada pelo gasto): público saturado rende menos a cada real extra
    const fq = hc.filter(x => x.freq > 0);
    const freq = fq.length ? fq.reduce((a, x) => a + x.freq * x.spend, 0) / fq.reduce((a, x) => a + x.spend, 0) : null;
    const bHist = freq == null ? ELAST_HIST : freq >= 3.5 ? 0.45 : freq >= 2.5 ? 0.5 : freq < 1.8 ? 0.65 : ELAST_HIST;
    const refCpr = numIn(c.cpr) || null;

  const cur = hist.reduce((a, r) => a + r.S0, 0);
  const at = B => buildMediaPlan(camps, { ...inp, budget: String(B), minRoi: "-100" });
  // verba de lucro máximo: testa níveis entre 25% e 4x do maior entre a verba atual e a pedida
  // se o melhor ponto cair no limite da busca, amplia a faixa (até 3 vezes)
  let top = Math.max(cur, plan.budget) * 4, best = null, edge = false;
  for (let round = 0; round < 4; round++) {
    best = null;
    for (let i = 1; i <= 32; i++) { const B = Math.round(top * i / 32 / 10) * 10; if (B <= 0) continue; const p = at(B); if (p.ready && (!best || p.tot.profit > best.p.tot.profit)) best = { B: p.tot.spend, p, i }; }

    : R0 >= 100 && cur >= 3000 ? ["alta", "Baseada em " + brl(cur) + " investidos e " + fmtInt(R0) + " " + planUnit(plan.kind) + planBasis() + "."]
    : R0 >= 30 ? ["média", "Baseada em " + brl(cur) + " investidos e " + fmtInt(R0) + " " + planUnit(plan.kind) + ". Mais histórico deixa a previsão mais precisa."]

// largura real do elemento, para os gráficos desenharem em pixels (texto sempre no mesmo tamanho)
function useWidth(init, initH) {
  const ref = useRef(null); const [w, setW] = useState(init); const [h, setH] = useState(initH || 0);
  useEffect(() => {
    if (!ref.current) return;
    const upd = () => { const r = ref.current && ref.current.getBoundingClientRect(); if (r && r.width) { setW(Math.round(r.width)); setH(Math.round(r.height)); } };
    upd();
    let ro; try { ro = new ResizeObserver(upd); ro.observe(ref.current); } catch (e) { window.addEventListener("resize", upd); }
    return () => { if (ro) ro.disconnect(); else window.removeEventListener("resize", upd); };
  }, []);
  return [ref, w, h];
}

function tlMetrics() {
  const sum = (days, f) => days.reduce((a, d) => a + (f(d) || 0), 0);
  return [
    { k: "spend", l: "Investimento", get: d => d.spend, fmt: brl2, ax: axMoney, tot: days => brl(sum(days, d => d.spend)) },

  ];
}
// curva suave (Catmull-Rom) que quebra nos dias sem valor e nunca passa do eixo
function smoothPath(pts, floor) {
  const segs = []; let cur = [];
  pts.forEach(p => { if (p) cur.push(p); else if (cur.length) { segs.push(cur); cur = []; } });
  if (cur.length) segs.push(cur);
  return segs.map(s => {
    if (s.length === 1) return `M${s[0][0] - 2},${s[0][1]}h4`;
    let d = `M${s[0][0]},${s[0][1]}`;
    for (let i = 0; i < s.length - 1; i++) {
      const p0 = s[i - 1] || s[i], p1 = s[i], p2 = s[i + 1], p3 = s[i + 2] || p2, k = 0.18;
      const c1 = [p1[0] + (p2[0] - p0[0]) * k, Math.min(floor, p1[1] + (p2[1] - p0[1]) * k)], c2 = [p2[0] - (p3[0] - p1[0]) * k, Math.min(floor, p2[1] - (p3[1] - p1[1]) * k)];
      d += ` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
    }
    return d;
  });
}

        <defs><linearGradient id="tl-g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="var(--accent)" stopOpacity=".22" /><stop offset="1" stopColor="var(--accent)" stopOpacity="0" /></linearGradient></defs>

          <text x=${L - 8} y=${T + ih * (1 - f) + 4} textAnchor="end" className="tl-ax" fill=${TL_COLORS[0]}>${act[0].ax(scales[0] * f, scales[0])}</text>

        ${stages.slice(1).map((s, j) => { const i = j + 1; if (!fin(rates[i])) return null; const ym = (i - 1) * ROW + BAR + (ROW - BAR) / 2, t = pctA(rates[i]), w = t.length * 6.6 + 16;

function recFor(c) {
  if (c.noRev) return c.status !== "ativa" ? { k: "keep", label: "Manter pausada", pill: "pill-mute", icon: "pause", why: "Sem valor de conversão" } : { k: "keep", label: "Acompanhar", pill: "pill-mute", icon: "eye", why: c.ch === "google" ? "Sem valor de conversão: avalie pelo CPA" : "Campanha sem venda: avalie pelo custo por " + (c.result === "leads" ? "lead" : c.result === "conversas" ? "conversa" : "resultado") };
  const roas = roasOf(c);
  if (!hasTarget()) {
    // sem meta: só o que é objetivo (ROAS abaixo de 1 = gasta mais do que traz) e a tendência da semana
    if (c.status !== "ativa") return { k: "keep", label: "Manter pausada", pill: "pill-mute", icon: "pause", why: "Sem meta de ROAS para comparar" };
    if (roas < 1) return { k: "review", label: "Revisar", pill: "pill-warn", icon: "alert", why: "ROAS de " + xroas(roas) + ": traz menos do que gasta" };
    if (c.d7 <= -0.15) return { k: "review", label: "Revisar", pill: "pill-warn", icon: "alert", why: "Receita caiu " + pct(-c.d7, 0) + " em 7 dias" };
    if (c.limited) return { k: "scale", label: "Escalar", pill: "pill-good", icon: "up", why: "Perde impressões por falta de orçamento" };
    return { k: "keep", label: "Acompanhar", pill: "pill-mute", icon: "eye", why: "Defina uma meta de ROAS em Integrações para receber recomendações" };
  }
  if (c.status !== "ativa") return roas >= ACTIVE.target
    ? { k: "reactivate", label: "Reativar", pill: "pill-info", icon: "play", why: "ROAS de " + xroas(roas) + " quando estava ativa" }
    : { k: "keep", label: "Manter pausada", pill: "pill-mute", icon: "pause", why: "Estava abaixo da meta" };
  if (roas < 1.5) return { k: "pause", label: "Pausar", pill: "pill-bad", icon: "pause", why: "ROAS de " + xroas(roas) + ", menos da metade da meta" };
  if (roas < ACTIVE.target) return { k: "review", label: "Revisar", pill: "pill-warn", icon: "alert", why: "ROAS abaixo da meta de " + xroas(ACTIVE.target) };
  if (c.d7 <= -0.15) return { k: "review", label: "Revisar", pill: "pill-warn", icon: "alert", why: "Receita caiu " + pct(-c.d7, 0) + " em 7 dias" };

  return { k: "keep", label: "Manter", pill: "pill-mute", icon: "check", why: "Dentro da meta" };
}

    ${ACTIVE.live ? html`<${IdleCampaigns} idle=${idle} />` : null}

}

function useMetaCreatives(meta, kind, enabled, at, period) {
  const [st, setSt] = useState({ status: "idle" });
  const per = period ? { since: period.since, until: period.until } : undefined;
  const key = JSON.stringify([enabled, meta && [meta.accountId, meta.token.slice(-8)], kind, at ? +at : 0, per]);
  useEffect(() => {
    if (!enabled || !meta) { setSt({ status: "idle" }); return; }
    let dead = false; setSt({ status: "loading" });
    apiPost("/api/meta", { action: "creatives", account_id: meta.accountId, kind, period: per }, { "x-meta-token": meta.token })
      .then(d => { if (!dead) setSt({ status: "ready", data: d }); }, e => { if (!dead) setSt({ status: "error", error: e.message }); });
    return () => { dead = true; };
  }, [key]);
  return st;
}
// status do criativo a partir dos dados reais
function creStatus(k, sells) {
  if (k.results === 0 && k.spend > 0) return ["pill-bad", "Sem resultado", "Gastou " + brl2(k.spend) + " sem nenhum resultado"];
  if (k.freq >= 4) return ["pill-warn", "Fadiga", "Frequência de " + dec(k.freq, 1) + ": o mesmo público já viu muitas vezes"];
  if (k.ctrTrend != null && k.ctrTrend <= -0.25) return ["pill-warn", "CTR caindo", "CTR caiu " + pct(-k.ctrTrend, 0) + " na última semana"];
  if (sells && hasTarget() && k.spend > 0 && k.revenue / k.spend < ACTIVE.target) return ["pill-bad", "Abaixo da meta", "ROAS abaixo da meta de " + xroas(ACTIVE.target)];
  return ["pill-good", "Saudável", "Sem sinal de fadiga"];
}
function LiveCreatives({ cre }) {
  const [view, setViewS] = useState(() => store.get("readyai_cre_view", "grid"));
  const setView = v => { setViewS(v); store.set("readyai_cre_view", v); };
  const [q, setQ] = useState(""); const [stF, setStF] = useState("all"); const [fmtF, setFmtF] = useState("all"); const [campF, setCampF] = useState("all");
  const [sort, setSort] = useState({ k: "rank", dir: 1 });
  const d = cre && cre.status === "ready" ? cre.data : null;
  const ads = d ? d.ads : [];
  const kind = d ? d.kind : "resultados", kl = kindLabel(kind);
  const sells = ads.some(a => a.revenue > 0);
  // ranking: ROAS quando vende; senão menor custo por resultado; sem resultado vai para o fim
  const ranked = useMemo(() => [...ads].sort((a, b) => sells ? (b.revenue / b.spend) - (a.revenue / a.spend) : ((a.results > 0 ? a.spend / a.results : 1e9) - (b.results > 0 ? b.spend / b.results : 1e9)) || b.spend - a.spend)
    .map((k, i) => ({ ...k, rank: i + 1, st: creStatus(k, sells) })), [ads, sells]);
  const main = k => sells ? ["ROAS", xroas(k.revenue / k.spend)] : [kindCost(kind), k.results > 0 ? brl2(k.spend / k.results) : "—"];
  const third = k => k.hook != null ? ["Retenção 3s", pct(k.hook, 0)] : ["Investido", brl2(k.spend)];
  const thumb = (k, cls) => k.thumb ? html`<img className=${cls} src=${k.thumb} alt="" loading="lazy" referrerPolicy="no-referrer" onError=${e => { e.target.style.display = "none"; }} />` : null;
  // opções dos filtros vêm dos próprios anúncios
  const stOpts = [...new Set(ranked.map(k => k.st[1]))].map(l => [l, ranked.filter(k => k.st[1] === l).length, ranked.find(k => k.st[1] === l).st[0]]);
  const fmts = [...new Set(ranked.map(k => k.format).filter(Boolean))].sort();
  const campsL = [...new Set(ranked.map(k => k.campaign).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const SORTS = { rank: k => k.rank, main: k => sells ? -(k.revenue / k.spend) : (k.results > 0 ? k.spend / k.results : 1e9), ctr: k => -(k.clicks / k.impr || 0), results: k => -k.results, spend: k => -k.spend };
  const list = ranked.filter(k => (stF === "all" || k.st[1] === stF) && (fmtF === "all" || k.format === fmtF) && (campF === "all" || k.campaign === campF) && (!q || norm(k.name + " " + k.campaign).includes(norm(q))))
    .sort((a, b) => (SORTS[sort.k](a) - SORTS[sort.k](b)) * sort.dir || a.rank - b.rank);
  const filtered = stF !== "all" || fmtF !== "all" || campF !== "all" || q;
  const clear = () => { setQ(""); setStF("all"); setFmtF("all"); setCampF("all"); };
  const sortBy = k => setSort(s => s.k === k ? { k, dir: -s.dir } : { k, dir: 1 });
  const th = (k, l) => html`<button type="button" className=${"r th-sort" + (sort.k === k ? " on" : "")} onClick=${() => sortBy(k)} title="Ordenar">${l}${sort.k === k ? html`<span className=${"th-arr" + (sort.dir < 0 ? " up" : "")}><${Icon} n="chevD" s=${12} /></span>` : null}</button>`;
  const head = html`<${PageHead} title="Criativos" sub=${sells ? "Anúncios ranqueados por ROAS, com sinais de fadiga." : "Anúncios ranqueados pelo menor " + kindCost(kind).toLowerCase() + ", com sinais de fadiga."} right=${html`<div className="seg view-seg" role="group" aria-label="Visualização"><button className=${view === "grid" ? "on" : ""} onClick=${() => setView("grid")} aria-label="Ver em grade" aria-pressed=${view === "grid"} title="Grade"><${Icon} n="grid" s=${15} /></button><button className=${view === "list" ? "on" : ""} onClick=${() => setView("list")} aria-label="Ver em lista" aria-pressed=${view === "list"} title="Lista"><${Icon} n="list" s=${15} /></button></div>`} />`;
  if (!cre || cre.status === "loading" || cre.status === "idle") return html`<div className="stack">${head}<div className="card card-pad"><${BreakNote}>Buscando os anúncios na Meta…<//></div></div>`;
  if (cre.status === "error") return html`<div className="stack">${head}<div className="card card-pad"><${BreakNote}>Não consegui buscar os anúncios: ${cre.error}<//></div></div>`;
  if (!ads.length) return html`<div className="stack">${head}<div className="card card-pad"><${BreakNote}>Nenhum anúncio da Meta teve investimento no período selecionado.<//></div></div>`;
  return html`<div className="stack">${head}
    <div className="cre-tools">
      <div className="cre-tools-row">
        <label className="cre-search"><${Icon} n="search" s=${15} /><input value=${q} onInput=${e => setQ(e.target.value)} placeholder="Buscar anúncio ou campanha" aria-label="Buscar anúncio ou campanha" />${q ? html`<button type="button" onClick=${() => setQ("")} aria-label="Limpar busca"><${Icon} n="x" s=${13} /></button>` : null}</label>
        ${fmts.length > 1 ? html`<select className="input cre-sel" value=${fmtF} onChange=${e => setFmtF(e.target.value)} aria-label="Formato"><option value="all">Todos os formatos</option>${fmts.map(f => html`<option key=${f} value=${f}>${f}</option>`)}</select>` : null}
        ${campsL.length > 1 ? html`<select className="input cre-sel cre-sel-camp" value=${campF} onChange=${e => setCampF(e.target.value)} aria-label="Campanha"><option value="all">Todas as campanhas</option>${campsL.map(c => html`<option key=${c} value=${c}>${c}</option>`)}</select>` : null}
        <select className="input cre-sel" value=${sort.k + ":" + sort.dir} onChange=${e => { const [k, dir] = e.target.value.split(":"); setSort({ k, dir: Number(dir) }); }} aria-label="Ordenar"><option value="rank:1">Ordenar: ranking</option><option value="main:1">${sells ? "Maior ROAS" : "Menor " + kindCost(kind).toLowerCase()}</option><option value="ctr:1">Maior CTR</option><option value="results:1">Mais ${kl.toLowerCase()}</option><option value="spend:1">Maior investimento</option></select>
      </div>
      <div className="cre-tools-row">

          <button type="button" className=${"cre-chip" + (stF === "all" ? " on" : "")} onClick=${() => setStF("all")}>Todos<span>${ranked.length}</span></button>
          ${stOpts.map(([l, nn, cls]) => html`<button key=${l} type="button" className=${"cre-chip " + cls.replace("pill-", "c-") + (stF === l ? " on" : "")} onClick=${() => setStF(stF === l ? "all" : l)} aria-pressed=${stF === l}><i></i>${l}<span>${nn}</span></button>`)}
        </div>
        <span className="cre-count">${filtered ? html`${list.length} de ${ranked.length} anúncios · <button type="button" className="link-btn" onClick=${clear}>Limpar filtros</button>` : ranked.length + " anúncios"}</span>
      </div>
    </div>
    ${!list.length ? html`<div className="card card-pad"><${BreakNote}>Nenhum anúncio com esses filtros. <button type="button" className="link-btn" onClick=${clear}>Limpar filtros</button><//></div>`
    : view === "list" ? html`<div className="card cre-list">
      <div className="cre-row cre-row-head"><span></span><button type="button" className=${"th-sort" + (sort.k === "rank" ? " on" : "")} onClick=${() => setSort({ k: "rank", dir: 1 })}>Anúncio</button><span>Status</span>${th("main", main(ranked[0])[0])}${th("ctr", "CTR")}${th("results", kl)}${th("spend", "Investido")}</div>

async function apiPost(path, body, headers) {
  let r;

    r = await fetch(path, { method: "POST", headers: { "content-type": "application/json", ...(headers || {}) }, body: JSON.stringify(body) });
  } catch (e) { throw new Error("Sem conexão com o servidor do app. Confira sua internet e tente de novo."); }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    const err = new Error(j.error || (r.status === 404 || r.status === 405 ? "O servidor do app não está disponível aqui. Use a versão publicada na Vercel." : "Falha na consulta (" + r.status + ")."));
    err.code = j.code; throw err;
  }
  return j;
}
