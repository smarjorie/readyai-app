function staleSince(last) {
  if (!last) return null;
  const lim = new Date(); lim.setDate(lim.getDate() - 2);
  const y = lim.getFullYear() + "-" + String(lim.getMonth() + 1).padStart(2, "0") + "-" + String(lim.getDate()).padStart(2, "0");
  return last < y ? ddmm(last) : null;
}
function DataBand({ live, company, go, isLive }) {
  if (live.status === "loading") return html`<div className="data-band"><span className="spin" aria-hidden="true"></span><span>Buscando as campanhas conectadas…</span></div>`;
  const errs = Object.entries(live.errors || {});
  if (isLive) return html`<div className="data-band live"><span className="pill pill-good"><span className="dot"></span>Dados reais</span>
    <span className="band-src">${live.sources.map(s => html`<span key=${s.ch} className="acc-chip"><span className="ch-dot" style=${{ background: CH[s.ch].color }}></span>${CH[s.ch].label} · ${s.label}</span>`)}</span>
    ${errs.length ? html`<span className="band-err">${errs.map(([ch, m]) => CH[ch].label + ": " + m).join(" ")}</span>` : html`${staleSince(live.lastSpend) ? html`<span className="stale-pill" title="Nenhuma campanha gastou desde esta data. Os números do período não mudam até a conta voltar a veicular."><${Icon} n="alert" s=${13} />Sem veiculação desde ${staleSince(live.lastSpend)}</span>` : null}<span className="band-note hide-sm">Últimos 30 dias${live.period ? " (" + ddmm(live.period.since) + " a " + ddmm(live.period.until) + ")" : ""} · atualizado às ${live.at ? live.at.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : ""}</span>`}
    <button className="btn btn-sm btn-line" onClick=${live.reload}>Atualizar</button></div>`;
  if (errs.length) return html`<div className="data-band err"><${Icon} n="alert" s=${15} /><span style=${{ flex: 1, minWidth: 200 }}>${errs.map(([ch, m]) => html`<span key=${ch} style=${{ display: "block" }}><b>${CH[ch].label}:</b> ${m}</span>`)}<span style=${{ display: "block", color: "var(--muted-2)" }}>Enquanto isso, o painel mostra dados de exemplo.</span></span>
    <button className="btn btn-sm btn-line" onClick=${live.reload}>Tentar de novo</button><button className="btn btn-sm btn-primary" onClick=${() => go("integrations")}>Ver integrações</button></div>`;
  if (live.status === "ready") return html`<div className="data-band"><${Icon} n="eye" s=${15} /><span style=${{ flex: 1, minWidth: 200 }}>${live.sources.map(s => s.note).filter(Boolean)[0] || "As contas conectadas não têm campanhas com investimento nos últimos 30 dias."} O painel mostra dados de exemplo.</span><button className="btn btn-sm btn-line" onClick=${() => go("integrations")}>Ver integrações</button></div>`;
  return html`<div className="data-band demo"><${Icon} n="eye" s=${15} /><span style=${{ flex: 1, minWidth: 200 }}>Você está vendo <b>dados de exemplo</b>. Conecte o Meta Ads ou o Google Ads para ver as campanhas de ${company}.</span><button className="btn btn-sm btn-primary" onClick=${() => go("integrations")}><${Icon} n="plug" s=${14} />Conectar contas</button></div>`;
}

function MetaConnectDrawer({ client, onUpdate, onClose, toast, agency }) {
  const cur = (client.conn || {}).meta || null;
  const [via, setVia] = useState(cur && cur.via === "mcp" ? "mcp" : "api");
  const [token, setToken] = useState(cur ? cur.token : ""); const [show, setShow] = useState(false);
  const [list, setList] = useState(null); const [user, setUser] = useState("");
  const [sel, setSel] = useState(cur ? cur.accountId : ""); const [q, setQ] = useState("");
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(null);
  const find = async e => {
    e && e.preventDefault(); if (!token.trim() || busy) return;
    setBusy(true); setErr(null);
    try {
      const j = await apiPost(metaApi({ via }), { action: "accounts" }, { "x-meta-token": token.trim() });
      setList(j.accounts || []); setUser(j.user || "");
      if (!(j.accounts || []).length) setErr("O token é válido, mas não enxerga nenhuma conta de anúncio. Confira se o usuário tem acesso às contas no Business Manager.");
      else if (!(j.accounts || []).some(a => a.id === sel)) setSel((j.accounts.find(a => a.active) || j.accounts[0]).id);
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  };
  const save = () => {
    if (agency) {
      onUpdate({ conn: { ...(client.conn || {}), meta: { token: token.trim(), via, accountId: "all", accountName: list.length + " contas", user, at: new Date().toISOString() } } });
      toast("Meta Ads conectado: " + list.length + " contas na carteira"); onClose(); return;
    }
    const a = list.find(x => x.id === sel); if (!a) return;
    onUpdate({ conn: { ...(client.conn || {}), meta: { token: token.trim(), via, accountId: a.id, accountName: a.name, user, at: new Date().toISOString() } } });
    toast("Meta Ads conectado: " + a.name); onClose();
  };
  const shown = (list || []).filter(a => !q || (a.name + a.id).toLowerCase().includes(q.toLowerCase()));
  return html`<${Fragment}><div className="drawer-bg" style=${{ zIndex: 60 }} onClick=${onClose}></div>
    <aside className="drawer" style=${{ zIndex: 61 }} role="dialog" aria-modal="true" aria-label="Conectar Meta Ads">
      <div className="drawer-head"><div><div className="eyebrow">Integração · ${client.company}</div><h2 style=${{ fontSize: 20, fontWeight: 700 }}>Conectar Meta Ads</h2>
        <div className="card-sub">${via === "mcp" ? "Leitura das campanhas pelo MCP oficial da Meta, com um token de acesso." : "Leitura das campanhas pela Marketing API da Meta, com um token de acesso."}</div></div>
        <button type="button" className="btn btn-ghost btn-sm" onClick=${onClose} aria-label="Fechar"><${Icon} n="x" /></button></div>
      <div className="drawer-body">
        <div className="field"><label>Como conectar</label>
          <div className="ai-tabs two" role="radiogroup" aria-label="Como conectar a Meta">${[["api", "Marketing API", "Graph API com token"], ["mcp", "MCP da Meta", "mcp.facebook.com/ads"]].map(([k, t, d]) => html`
            <button type="button" key=${k} role="radio" aria-checked=${via === k} className=${"ai-tab" + (via === k ? " on" : "")} onClick=${() => { setVia(k); setList(null); setErr(null); }}>
              <b>${t}</b><small className=${k === "mcp" ? "mono" : ""}>${d}</small></button>`)}</div></div>
        <ol className="steps">
          <li className=${list ? "done" : "on"}><b>Token de acesso</b>
            <form onSubmit=${find} className="stack" style=${{ gap: 8, marginTop: 8 }}>
              <div className="pass-wrap"><input id="meta-token" className="input mono" style=${{ fontSize: 13 }} type=${show ? "text" : "password"} autoComplete="off" spellCheck="false" placeholder="EAAG…" value=${token} onInput=${e => { setToken(e.target.value); setList(null); }} />
                <button type="button" className="pass-eye" onClick=${() => setShow(!show)} aria-label=${show ? "Ocultar token" : "Mostrar token"}><${Icon} n=${show ? "eyeOff" : "eye"} s=${16} /></button></div>
              <button className="btn btn-primary" type="submit" disabled=${!token.trim() || busy}>${busy ? "Validando token…" : list ? "Buscar contas de novo" : "Validar e buscar contas"}</button>
            </form>
            <details className="help" open=${via === "mcp"}><summary>Como gerar o token</summary>
              ${via === "mcp" ? html`<p>O app chama <span className="mono">https://mcp.facebook.com/ads</span> com o seu token, como a Meta documenta para integrações programáticas. O token precisa das permissões <span className="mono">ads_mcp_management</span> e <span className="mono">ads_read</span>.</p>` : null}
              <p><b>Para testar:</b> abra o <a href="https://developers.facebook.com/tools/explorer/" target="_blank" rel="noopener noreferrer">Graph API Explorer</a>, escolha seu app, adicione a permissão <span className="mono">${via === "mcp" ? "ads_mcp_management, ads_read" : "ads_read"}</span> e clique em Generate Access Token. Esse token expira em poucas horas.</p>
              <p><b>Para uso contínuo:</b> no Business Manager, em Configurações do negócio › Usuários do sistema, crie um usuário do sistema, dê acesso às contas de anúncio e gere um token com <span className="mono">${via === "mcp" ? "ads_mcp_management e ads_read" : "ads_read"}</span>. Esse token não expira.${via === "mcp" ? " A Meta documenta o MCP com token de usuário; se o token de usuário do sistema for recusado, use a Marketing API." : ""}</p></details>
          </li>
          <li className=${list ? "on" : ""}><b>${agency ? "Contas que entram na carteira" : "Conta de anúncio"}</b>
            ${list ? html`<div className="stack" style=${{ gap: 8, marginTop: 8 }}>
              ${user ? html`<span className="card-sub">Token de ${user} · ${list.length} ${list.length === 1 ? "conta" : "contas"}</span>` : null}
              ${list.length > 8 ? html`<input id="meta-q" className="input" placeholder="Buscar conta" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Buscar conta" />` : null}
              <div className="acc-list" role=${agency ? "list" : "radiogroup"} aria-label="Conta de anúncio">${shown.map(a => html`<label key=${a.id} className=${"acc-opt" + (!agency && sel === a.id ? " on" : "")}>
                ${agency ? null : html`<input type="radio" name="meta-acc" checked=${sel === a.id} onChange=${() => setSel(a.id)} />`}
                <span style=${{ minWidth: 0, flex: 1 }}><b>${a.name}</b><span className="mono">${a.id} · ${a.currency}</span></span>
                <span className=${"pill " + (a.active ? "pill-good" : "pill-warn")}>${a.status}</span></label>`)}</div>
            </div>` : html`<p className="card-sub" style=${{ marginTop: 6 }}>Aparece depois de validar o token.</p>`}
          </li>
        </ol>
        ${err ? html`<div className="err" role="alert">${err}</div>` : null}
        <div className="ai-note"><${Icon} n="shield" s=${15} /><div>O token fica salvo ${SERVER.mode === "server" ? "no cadastro de " + client.company + ", no banco da ReadyAI," : "neste navegador, no cadastro de " + client.company + ","} e só é usado para ler campanhas. Pausar ou alterar orçamento pelo painel continua sendo simulação.</div></div>
      </div>
      <div className="drawer-foot">
        ${cur ? html`<button type="button" className="btn btn-line" onClick=${() => { const c = { ...(client.conn || {}) }; delete c.meta; onUpdate({ conn: c }); toast("Meta Ads desconectado"); onClose(); }}>Desconectar</button>` : html`<button type="button" className="btn btn-line" onClick=${onClose}>Cancelar</button>`}
        <button type="button" className="btn btn-primary" disabled=${!list || (!agency && !sel)} onClick=${save}>${agency ? "Conectar carteira" : "Conectar conta"}</button>
      </div>
    </aside><//>`;
}

function GoogleConnectDrawer({ client, onUpdate, onClose, toast }) {
  const cur = (client.conn || {}).google || null;
  const [slug, setSlug] = useState(cur ? cur.slug : "readyai-" + slugify(client.company));
  const [rt, setRt] = useState(cur ? cur.refreshToken || "" : "");
  const [auth, setAuth] = useState(null); const [list, setList] = useState(null); const [sel, setSel] = useState(cur ? cur.customerId : "");
  const [busy, setBusy] = useState(""); const [err, setErr] = useState(null);
  const body = extra => ({ slug, refresh_token: rt.trim() || undefined, ...extra });
  const authorize = async () => {
    setBusy("auth"); setErr(null); setList(null);
    try { const j = await apiPost("/api/google", body({ action: "connect" })); setAuth(j); if (j.authorized) await accounts(); }
    catch (e) { setErr(e.message); } finally { setBusy(""); }
  };
  const accounts = async () => {
    setBusy("acc"); setErr(null);
    try {
      const j = await apiPost("/api/google", body({ action: "accounts" }));
      const l = j.accounts || []; setList(l); setAuth({ authorized: true });
      if (!l.length) setErr("O login do Google não enxerga nenhuma conta do Google Ads.");
      else if (!l.some(a => a.id === sel)) setSel((l.find(a => !a.manager) || l[0]).id);
    } catch (e) { setErr(e.message); if (e.code === "needs_auth") setAuth(null); } finally { setBusy(""); }
  };
  const save = () => {
    const a = list.find(x => x.id === sel); if (!a) return;
    onUpdate({ conn: { ...(client.conn || {}), google: { slug, customerId: a.id, customerName: a.name ? a.name + " · " + a.label : a.label, refreshToken: rt.trim() || undefined, at: new Date().toISOString() } } });
    toast("Google Ads conectado: " + (a.name || a.label)); onClose();
  };
  return html`<${Fragment}><div className="drawer-bg" style=${{ zIndex: 60 }} onClick=${onClose}></div>
    <aside className="drawer" style=${{ zIndex: 61 }} role="dialog" aria-modal="true" aria-label="Conectar Google Ads">
      <div className="drawer-head"><div><div className="eyebrow">Integração · ${client.company}</div><h2 style=${{ fontSize: 20, fontWeight: 700 }}>Conectar Google Ads</h2>
        <div className="card-sub">Leitura das campanhas pelo MCP do Google Ads, o mesmo conector usado no Claude.</div></div>
        <button type="button" className="btn btn-ghost btn-sm" onClick=${onClose} aria-label="Fechar"><${Icon} n="x" /></button></div>
      <div className="drawer-body">
        <ol className="steps">
          <li className=${auth && auth.authorized ? "done" : "on"}><b>Autorizar no Google</b>
            <p className="card-sub" style=${{ marginTop: 4 }}>O MCP guarda a autorização deste cliente com o identificador <span className="mono">${slug}</span>. Quem tem acesso à conta do Google Ads faz o login uma vez.</p>
            <div style=${{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
              <button type="button" className="btn btn-primary" disabled=${!!busy} onClick=${authorize}>${busy === "auth" ? "Verificando…" : auth && auth.authorized ? "Verificar de novo" : "Autorizar no Google"}</button>
              ${auth && !auth.authorized ? html`<button type="button" className="btn btn-line" disabled=${!!busy} onClick=${accounts}>${busy === "acc" ? "Buscando…" : "Já autorizei, buscar contas"}</button>` : null}
            </div>
            ${auth && !auth.authorized && auth.url ? html`<div className="auth-link"><span>Abra o login do Google, autorize o acesso e volte aqui:</span><a className="btn btn-sm btn-line" href=${auth.url} target="_blank" rel="noopener noreferrer"><${Icon} n="arrowR" s=${13} />Abrir login do Google</a></div>` : null}
            <details className="help"><summary>Opções avançadas</summary>
              <div className="field" style=${{ marginTop: 8 }}><label htmlFor="g-slug">Identificador do cliente no MCP</label><input id="g-slug" className="input mono" style=${{ fontSize: 13 }} value=${slug} onInput=${e => { setSlug(slugify(e.target.value)); setAuth(null); setList(null); }} /><span className="card-sub">Use o mesmo identificador que esse cliente já usa no conector do Claude, se houver.</span></div>
              <div className="field" style=${{ marginTop: 8 }}><label htmlFor="g-rt">refresh_token (só se o MCP pedir)</label><input id="g-rt" className="input mono" style=${{ fontSize: 13 }} type="password" autoComplete="off" value=${rt} onInput=${e => setRt(e.target.value)} placeholder="Copiado da página de sucesso do login" /><span className="card-sub">Necessário apenas quando o MCP não tem banco persistente e mostra o token na página de sucesso.</span></div>
            </details>
          </li>
          <li className=${list ? "on" : ""}><b>Conta do Google Ads</b>
            ${list ? html`<div className="acc-list" role="radiogroup" aria-label="Conta do Google Ads" style=${{ marginTop: 8 }}>${list.map(a => html`<label key=${a.id} className=${"acc-opt" + (sel === a.id ? " on" : "")}>
                <input type="radio" name="g-acc" checked=${sel === a.id} onChange=${() => setSel(a.id)} />
                <span style=${{ minWidth: 0, flex: 1 }}><b>${a.name || "Conta " + a.label}</b><span className="mono">${a.label}${a.via ? " · via MCC " + a.via : ""}</span></span>
                ${a.manager ? html`<span className="pill pill-mute">Gerenciadora</span>` : null}</label>`)}</div>` : html`<p className="card-sub" style=${{ marginTop: 6 }}>Aparece depois da autorização.</p>`}
          </li>
        </ol>
        ${err ? html`<div className="err" role="alert">${err}</div>` : null}
        <div className="ai-note"><${Icon} n="bulb" s=${15} /><div>O conector do Google Ads ainda não informa o valor das conversões. As campanhas do Google entram com investimento, cliques e conversões, e o ROAS delas aparece como n/d.</div></div>
      </div>
      <div className="drawer-foot">
        ${cur ? html`<button type="button" className="btn btn-line" onClick=${() => { const c = { ...(client.conn || {}) }; delete c.google; onUpdate({ conn: c }); toast("Google Ads desconectado"); onClose(); }}>Desconectar</button>` : html`<button type="button" className="btn btn-line" onClick=${onClose}>Cancelar</button>`}
        <button type="button" className="btn btn-primary" disabled=${!list || !sel} onClick=${save}>Conectar conta</button>
      </div>
    </aside><//>`;
}

function AdIntegrations({ client, onUpdate, toast, isAgency, live }) {
  const [open, setOpen] = useState(null);
  const conn = client.conn || {};
  const [target, setTarget] = useState(client.targetRoas ? String(client.targetRoas).replace(".", ",") : "");
  const saveTarget = e => { e.preventDefault(); if (!target.trim()) { onUpdate({ targetRoas: null }); return toast("Conta sem meta de ROAS"); } const v = parseFloat(target.replace(",", ".")); if (!(v > 0 && v < 100)) return toast("Informe uma meta de ROAS entre 0,1 e 99, ou deixe em branco"); onUpdate({ targetRoas: Math.round(v * 100) / 100 }); toast("Meta de ROAS salva: " + xroas(v)); };
  const card = (key, title, sub, on, detail, err) => html`<article key=${key} className="card card-pad" style=${{ display: "flex", flexDirection: "column", gap: 12 }}>
    <div style=${{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "flex-start" }}><div><div className="card-title" style=${{ display: "flex", alignItems: "center", gap: 8 }}><span className="ch-dot" style=${{ background: CH[key].color }}></span>${title}</div><div className="card-sub">${sub}</div></div>
      <span className=${"pill " + (err ? "pill-bad" : on ? "pill-good" : "pill-mute")}>${err ? "Com erro" : on ? html`<span className="dot"></span>Conectado` : "Não conectado"}</span></div>
    ${err ? html`<div className="err" style=${{ fontSize: 12.5 }}>${err}</div>` : null}
    <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}><span className="mono" style=${{ color: "var(--muted)", minWidth: 0, overflow: "hidden", textOverflow: "ellipsis" }}>${detail}</span>
      <button className=${"btn btn-sm " + (on ? "btn-line" : "btn-primary")} onClick=${() => setOpen(key)}>${on ? "Gerenciar" : "Conectar"}</button></div>
  </article>`;
  return html`<div className="stack" style=${{ gap: 10 }}>
    <div className="eyebrow">Contas de anúncio</div>
    ${isAgency ? html`<p className="card-sub">Na agência, todas as contas de anúncio que o token da Meta acessa viram clientes da carteira. Google Ads e TikTok ainda não entram na carteira.</p>` : null}
    <div className="grid g2">
      ${card("meta", "Meta Ads", "Campanhas, investimento, compras e receita pela Marketing API ou pelo MCP oficial da Meta", metaOn(conn), metaOn(conn) ? (isAgency ? "Token" + (conn.meta.user ? " de " + conn.meta.user : "") + " · carteira com as contas dele" : conn.meta.accountName + " · " + conn.meta.accountId) + (conn.meta.via === "mcp" ? " · via MCP" : " · via API") : "Marketing API ou MCP da Meta", live && live.errors && live.errors.meta)}
      ${card("google", "Google Ads", "Campanhas, investimento, cliques e conversões pelo MCP do Google Ads", googleOn(conn), googleOn(conn) ? conn.google.customerName : "Login com a conta Google", live && live.errors && live.errors.google)}
      <article className="card card-pad" style=${{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style=${{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "flex-start" }}><div><div className="card-title" style=${{ display: "flex", alignItems: "center", gap: 8 }}><span className="ch-dot" style=${{ background: CH.tiktok.color }}></span>TikTok Ads</div><div className="card-sub">Campanhas e Spark Ads</div></div><span className="pill pill-violet">Em breve</span></div>
        <span className="mono" style=${{ color: "var(--muted)" }}>Ainda sem conector</span></article>
      <form className="card card-pad" onSubmit=${saveTarget} style=${{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div><div className="card-title">Meta de ROAS da conta <span style=${{ fontWeight: 500, color: "var(--muted)", fontSize: 13 }}>(opcional)</span></div><div className="card-sub">Quando preenchida, entra nos insights, nas recomendações e no copilot. Deixe em branco para não usar meta.</div></div>
        <div style=${{ display: "flex", gap: 8, alignItems: "center" }}><input id="target-roas" className="input num" style=${{ maxWidth: 110 }} inputMode="decimal" value=${target} onInput=${e => setTarget(e.target.value)} placeholder="Sem meta" aria-label="Meta de ROAS" /><span style=${{ color: "var(--muted)" }}>x</span><button className="btn btn-sm btn-line" type="submit">Salvar</button></div>
      </form>
    </div>
    ${open === "meta" ? html`<${MetaConnectDrawer} client=${client} onUpdate=${onUpdate} onClose=${() => setOpen(null)} toast=${toast} agency=${isAgency} />` : null}

  </div>`;
}

/* ================= carteira da agência com as contas reais do token da Meta ================= */
function usePortfolio(client, enabled) {
  const m = enabled && metaOn(client.conn) ? client.conn.meta : null;
  const [tick, setTick] = useState(0);
  const [st, setSt] = useState({ status: "idle", accounts: [] });
  const key = JSON.stringify([m && m.token.slice(-8), m && m.via, tick]);
  useEffect(() => {
    if (!m) { setSt({ status: "idle", accounts: [] }); return; }
    let dead = false;
    setSt(s => ({ ...s, status: "loading", error: null }));
    apiPost(metaApi(m), { action: "portfolio" }, { "x-meta-token": m.token })
      .then(j => { if (!dead) setSt({ status: "ready", accounts: j.accounts || [], truncated: j.truncated, at: new Date() }); })
      .catch(e => { if (!dead) setSt({ status: "error", accounts: [], error: e.message }); });
    return () => { dead = true; };
  }, [key]);
  return { ...st, reload: () => setTick(t => t + 1) };
}

// Transforma cada conta de anúncio numa linha da carteira, no mesmo formato da carteira de exemplo
function livePortfolioRows(accounts, target) {
  const BLOCK = { 2: "Conta desativada", 3: "Pagamento pendente: entrega parada", 7: "Conta em análise pela Meta", 8: "Pagamento pendente: entrega parada", 9: "Período de carência do pagamento", 100: "Encerramento pendente", 101: "Conta encerrada" };
  return accounts.map(a => {
    const m = a.m30, w1 = a.w1, w0 = a.w0;
    const tracked = m.revenue > 0 ? m.spend : 0;
    const t = { spend: m.spend, revenue: m.revenue, purchases: m.purchases, clicks: m.clicks, impr: m.impr, tracked, roas: m.revenue / tracked, cpa: m.spend / m.purchases, ctr: m.clicks / m.impr, ticket: m.revenue / m.purchases };
    const issues = [];
    if (a.status !== 1) issues.push({ t: "block", ch: "meta", text: (BLOCK[a.status] || "Conta com restrição") + (a.reason ? " (" + a.reason + ")" : ""), act: "Ver conta", go: "overview" });
    const r7 = w1.revenue / w1.spend;
    let waste7 = 0;
    if (a.status === 1 && m.revenue > 0 && w1.spend >= 300 && r7 < 1.5) { waste7 = w1.spend; issues.push({ t: "waste", ch: "meta", text: "ROAS de " + xroas(r7) + " nos últimos 7 dias: " + brl(w1.spend) + " investidos", act: "Ver campanhas", go: "campaigns" }); }
    if (a.status === 1 && m.purchases > 0 && w1.spend >= 100 && w1.purchases === 0) issues.push({ t: "track", ch: "meta", text: "Nenhuma conversão registrada em 7 dias, com " + brl(w1.spend) + " de gasto", act: "Ver visão geral", go: "overview" });
    if (a.status === 1 && target && t.roas >= target * 1.5 && w1.spend > 0 && (!w1.revenue || r7 >= target)) issues.push({ t: "opp", ch: "meta", text: "ROAS de " + xroas(t.roas) + " em 30 dias, bem acima da meta", act: "Escalar", go: "campaigns" });
    const base7 = m.revenue > 0 ? [w1.revenue, w0.revenue] : [w1.spend, w0.spend];
    const d7 = base7[1] > 0 ? (base7[0] - base7[1]) / base7[1] : 0;
    issues.sort((x, y) => ISSUE[x.t].rank - ISSUE[y.t].rank);
    let health = m.spend > 0 ? 96 - issues.reduce((s, i) => s + ISSUE[i.t].w, 0) : 60;
    if (fin(t.roas) && t.roas < target) health -= Math.round((target - t.roas) / target * 40);
    if (a.status !== 1) health = Math.min(health, 40);
    health = Math.max(25, Math.min(96, health));
    const seg = [a.business || "Meta Ads", m.spend > 0 ? null : "sem gasto em 30 dias"].filter(Boolean).join(" · ");
    return { id: a.id, name: a.name, seg, target, budget: NaN, spent: a.month, chs: ["meta"], d7, issues, t, pace: NaN, over: 0, health, waste7, live: true, status: a.status,
      accounts: [{ ch: "meta", id: a.id, parent: a.business || "acesso direto do token", issue: issues.find(i => i.t === "block" || i.t === "track") }],
      yday: a.yday, dayBudget: NaN };
  });
}

/* ================= dados no servidor (banco + e-mail) ================= */
// No boot o app pergunta ao servidor se há banco. Com banco, clientes, senhas, convites e conexões ficam no servidor
// e valem em qualquer computador. Sem banco (ou fora da Vercel), tudo fica neste navegador, como na demonstração.
let SERVER = { mode: "local", db: false, email: false };
const SESSION_KEY = "readyai_session_v1";
async function srv(path, body, token) {
  let r;
  try { r = await fetch(path, { method: "POST", headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) }, body: JSON.stringify(body) }); }
  catch (e) { throw new Error("Sem conexão com o servidor. Confira sua internet e tente de novo."); }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || "Falha no servidor (" + r.status + ")."); err.code = j.code; err.status = r.status; throw err; }
  return j;
}
// datas do servidor chegam em ISO; as da demonstração já vêm como texto ("hoje, 08:41")
function fmtWhen(v) {
  if (!v) return "nunca";
  if (!/^\d{4}-\d{2}-\d{2}T/.test(v)) return v;
  const d = new Date(v), now = new Date();
  const hm = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return "hoje, " + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "ontem, " + hm;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", "") + ", " + hm;
}
const fmtDay = v => v ? new Date(v).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
function copyText(txt, toast, ok) {
  try { navigator.clipboard.writeText(txt).then(() => toast(ok), () => toast("Selecione o texto e copie")); } catch (e) { toast("Selecione o texto e copie"); }
}

const KEY = "readyai_demo_v3";
function App() {
  const [ready, setReady] = useState(false);

  const [accepted, setAccepted] = useState(null);

    srv("/api/auth", { action: "status" })
      .then(j => { SERVER = { mode: j.db ? "server" : "local", db: !!j.db, email: !!j.email }; })
      .catch(() => { SERVER = { mode: "local", db: false, email: false }; })
      .finally(() => setReady(true));
  }, []);
  const clearInvite = () => { try { history.replaceState(null, "", location.pathname); } catch (e) {} setInvite(null); };
  if (!ready) return html`<div className="boot">Carregando ReadyAI…</div>`;
  if (invite) return html`<${InviteAccept} token=${invite} onLeave=${clearInvite} onAccepted=${j => { store.set(SESSION_KEY, { token: j.token, role: "client", clientId: j.client.id }); setAccepted(j.client); clearInvite(); }} />`;
  return SERVER.mode === "server" ? html`<${ServerApp} welcome=${accepted} />` : html`<${LocalApp} />`;
}

// ---------- modo com banco: tudo passa pelo servidor ----------
function ServerApp({ welcome }) {
  const [sess, setSessS] = useState(() => store.get(SESSION_KEY, null));
  const setSess = v => { setSessS(v); if (v) store.set(SESSION_KEY, v); else { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} } };
  const [clients, setClients] = useState(welcome ? [welcome] : []);
  const [admin, setAdmin] = useState(null);
  const [phase, setPhase] = useState(sess && !welcome ? "loading" : "ready");
  const [notice, setNotice] = useState(null);
  const tok = () => (store.get(SESSION_KEY, null) || {}).token;
  const call = (path, body) => srv(path, body, tok()).catch(e => { if (e.code === "no_session" || e.status === 401 && path === "/api/auth") { setSess(null); setNotice(e.message); } throw e; });
  const loadList = async () => { const j = await call("/api/clients", { action: "list" }); setClients(j.clients); return j.clients; };
  useEffect(() => {
    if (!sess || welcome) return;
    call("/api/auth", { action: "me" }).then(async j => {
      if (j.role === "admin") { setAdmin(j.admin); await loadList(); } else setClients([j.client]);
      setPhase("ready");
    }).catch(e => { setSess(null); setNotice(e.code === "no_session" ? e.message : null); setPhase("ready"); });
  }, []);
  // "abrir direto em Integrações" vale só na entrada
  useEffect(() => { if (sess && sess.to) setSess({ ...sess, to: null }); }, [sess && sess.to]);
  const auth = async (email, password) => {
    const j = await srv("/api/auth", { action: "login", email, password });
    setSess({ token: j.token, role: j.role, clientId: j.client ? j.client.id : null }); setNotice(null);
    if (j.role === "admin") { setAdmin(j.admin); setPhase("loading"); try { await loadList(); } finally { setPhase("ready"); } }
    else setClients([j.client]);
  };
  const replace = c => setClients(cs => cs.some(x => x.id === c.id) ? cs.map(x => x.id === c.id ? c : x) : [c, ...cs]);
  const legacy = useMemo(() => { const s = store.get(KEY, null); return s && Array.isArray(s.clients) ? s.clients : []; }, []);
  const api = {
    server: true, email: SERVER.email, refresh: loadList, legacy,
    create: async f => { const j = await call("/api/clients", { action: "create", client: f }); replace(j.client); return j; },
    update: async (id, patch) => {
      setClients(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c));
      try { const j = await call("/api/clients", { action: "update", id, patch }); replace(j.client); }
      catch (e) { loadList().catch(() => {}); throw e; }
    },
    remove: async id => { await call("/api/clients", { action: "delete", id }); setClients(cs => cs.filter(c => c.id !== id)); },
    resend: async id => { const j = await call("/api/clients", { action: "resend", id }); replace(j.client); return j; },
    resetPassword: async id => { const j = await call("/api/clients", { action: "reset_password", id }); replace(j.client); return j.password; },
    importLegacy: async list => { const j = await call("/api/clients", { action: "import", clients: list }); setClients(j.clients); return j; },
  };
  const logout = () => { setSess(null); setClients([]); setAdmin(null); };
  if (phase === "loading") return html`<div className="boot">Carregando ReadyAI…</div>`;
  if (!sess) return html`<${Login} auth=${auth} showDemo=${false} notice=${notice} />`;
  const asGone = sess.as && !clients.some(c => c.id === sess.as); // cliente excluído enquanto estava aberto
  if (sess.role === "admin" && (!sess.as || asGone)) return html`<${AdminConsole} clients=${clients} api=${api} adminName=${admin ? admin.name : "Gestora"} onLogout=${logout} onImpersonate=${(id, to) => setSess({ ...sess, as: id, to })} />`;
  const cid = sess.as || sess.clientId; const client = clients.find(c => c.id === cid);
  if (!client) return html`<${Login} auth=${auth} showDemo=${false} notice=${notice} />`;
  const onUpdate = patch => {
    setClients(cs => cs.map(c => c.id === client.id ? { ...c, ...patch } : c));
    const p = sess.role === "admin" ? call("/api/clients", { action: "update", id: client.id, patch }) : call("/api/clients", { action: "self_update", patch });
    p.then(j => replace(j.client)).catch(() => {});
  };
  return html`<${ClientApp} key=${client.id + client.modules.join()} client=${client} onLogout=${logout} impersonating=${!!sess.as} onBackToConsole=${() => setSess({ ...sess, as: null, to: null })} onUpdate=${onUpdate} startScreen=${sess.to} />`;
}

// ---------- modo local (sem banco): tudo neste navegador, como na demonstração ----------
function LocalApp() {
  const saved = store.get(KEY, null);
  const [clients, setClients] = useState(saved && saved.clients ? saved.clients : SEED_CLIENTS);
  const [session, setSession] = useState(saved && saved.session ? saved.session : null);
  useEffect(() => store.set(KEY, { clients, session }), [clients, session]);
  useEffect(() => { if (session && session.to) setSession(x => { const n = { ...x }; delete n.to; return n; }); }, [session && session.to]);
  const auth = async (email, pass) => {
    if (email === ADMIN.email) { let ok = false; try { ok = (await sha256(pass)) === ADMIN.passHash; } catch (x) {} if (ok) return setSession({ role: "admin" }); throw new Error("E-mail ou senha incorretos. Confira os dados e tente de novo."); }
    const c = clients.find(x => x.email.toLowerCase() === email);
    if (!c || c.password !== pass) throw new Error("E-mail ou senha incorretos. Confira os dados e tente de novo.");
    if (c.status === "suspenso") throw new Error("Seu acesso está suspenso. Fale com comercial@readyai.com para reativar.");
    setSession({ role: "client", clientId: c.id });
    setClients(cs => cs.map(x => x.id === c.id ? { ...x, lastAccess: "agora", status: x.status === "convite" ? "ativo" : x.status } : x));
  };
  const api = {
    server: false, email: false,
    create: async f => {
      if (clients.some(c => c.email.toLowerCase() === f.email)) throw new Error("Já existe um cliente com esse e-mail.");
      const p = tempPass();
      const c = { id: "cl" + Date.now(), ...f, conn: {}, password: p, newPass: p, status: "convite", since: new Date().toISOString().slice(0, 10), lastAccess: "nunca", accounts: 0 };
      setClients(cs => [c, ...cs]); return { client: c };
    },
    update: async (id, patch) => setClients(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c)),
    remove: async id => setClients(cs => cs.filter(c => c.id !== id)),
    resetPassword: async id => { const p = tempPass(); setClients(cs => cs.map(c => c.id === id ? { ...c, password: p, newPass: p } : c)); return p; },
  };
  if (!session) return html`<${Login} auth=${auth} showDemo=${true} />`;
  const logout = () => setSession(null);
  if (session.role === "admin" && !session.as) return html`<${AdminConsole} clients=${clients} api=${api} adminName=${ADMIN.name} onLogout=${logout} onImpersonate=${(id, to) => setSession({ ...session, as: id, to })} />`;
  const cid = session.as || session.clientId; const client = clients.find(c => c.id === cid);
  if (!client) return html`<${Login} auth=${auth} showDemo=${true} />`;
  const onUpdate = patch => setClients(cs => cs.map(c => c.id === client.id ? { ...c, ...patch } : c));
  return html`<${ClientApp} key=${client.id + client.modules.join()} client=${client} onLogout=${logout} impersonating=${!!session.as} onBackToConsole=${() => setSession({ role: "admin" })} onUpdate=${onUpdate} startScreen=${session.to} />`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
