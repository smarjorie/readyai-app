// "Últimos N dias" são dias completos, até ontem (como a Meta e o Google contam).
const PERIOD_PRESETS = [
  { id: "7d", label: "Últimos 7 dias", days: 7 },
  { id: "14d", label: "Últimos 14 dias", days: 14 },
  { id: "30d", label: "Últimos 30 dias", days: 30 },
  { id: "90d", label: "Últimos 90 dias", days: 90 },
  { id: "month", label: "Este mês" },
  { id: "lastmonth", label: "Mês passado" },
];
const pYmd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const pDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const pAdd = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const pToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const pFmt = (s, withYear) => { const d = pDate(s); return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + (withYear ? "/" + d.getFullYear() : ""); };
function periodRange(p) {
  const today = pToday();
  let since, until, label;
  const pre = PERIOD_PRESETS.find(x => x.id === (p && p.id)) || (p && p.id === "custom" ? null : PERIOD_PRESETS[2]);
  if (pre && pre.days) { until = pAdd(today, -1); since = pAdd(today, -pre.days); label = pre.label; }
  else if (pre && pre.id === "month") { since = new Date(today.getFullYear(), today.getMonth(), 1); until = today; label = pre.label; }
  else if (pre && pre.id === "lastmonth") { since = new Date(today.getFullYear(), today.getMonth() - 1, 1); until = new Date(today.getFullYear(), today.getMonth(), 0); label = pre.label; }
  else { since = pDate(p.since); until = pDate(p.until); }
  const s = pYmd(since), u = pYmd(until);
  const yr = since.getFullYear() !== today.getFullYear() || until.getFullYear() !== today.getFullYear();
  const dates = s === u ? pFmt(s, yr) : pFmt(s, yr) + " a " + pFmt(u, yr);
  return { id: pre ? pre.id : "custom", since: s, until: u, days: Math.round((until - since) / 86400e3) + 1, label: label || dates, dates, custom: !pre };
}
const WD = ["D", "S", "T", "Q", "Q", "S", "S"];
const MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function MonthGrid({ year, month, a, b, hover, onPick, onHover }) {
  const first = new Date(year, month, 1), days = new Date(year, month + 1, 0).getDate();
  const today = pToday(), cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(new Date(year, month, d));
  const end = b || hover;
  const lo = a && end ? (a < end ? a : end) : a, hi = a && end ? (a < end ? end : a) : a;
  return html`<div className="cal-m"><div className="cal-title">${MONTHS[month]} ${year}</div>
    <div className="cal-g">${WD.map((w, i) => html`<span key=${"w" + i} className="cal-wd">${w}</span>`)}
      ${cells.map((d, i) => { if (!d) return html`<span key=${"e" + i}></span>`; const s = pYmd(d); const fut = d > today;
        const cls = "cal-d" + (lo && s === pYmd(lo) ? " sel lo" : "") + (hi && s === pYmd(hi) ? " sel hi" : "") + (lo && hi && d > lo && d < hi ? " in" : "") + (s === pYmd(today) ? " today" : "");
        return html`<button key=${s} type="button" className=${cls} disabled=${fut} onClick=${() => onPick(d)} onMouseEnter=${() => onHover(d)} aria-label=${d.toLocaleDateString("pt-BR")}>${d.getDate()}</button>`; })}
    </div></div>`;
}

    ${open ? html`<div className="pp-pop" role="dialog" aria-label="Escolher período">

      <div className="pp-cal">
        <div className="pp-nav"><button type="button" className="btn btn-ghost btn-sm" onClick=${() => setView(new Date(view.getFullYear(), view.getMonth() - 1, 1))} aria-label="Mês anterior"><${Icon} n="chevD" s=${15} /></button>
          <button type="button" className="btn btn-ghost btn-sm nx" disabled=${!canNext} onClick=${() => setView(new Date(view.getFullYear(), view.getMonth() + 1, 1))} aria-label="Próximo mês"><${Icon} n="chevD" s=${15} /></button></div>
        <div className="pp-months" onMouseLeave=${() => setHover(null)}>

          <div className="pp-m2"><${MonthGrid} year=${m2.getFullYear()} month=${m2.getMonth()} a=${a} b=${b} hover=${a && !b ? hover : null} onPick=${pick} onHover=${setHover} /></div>
        </div>

function useLiveData(client, enabled, period) {
  const conn = client.conn || {};
  const [tick, setTick] = useState(0);
  const [st, setSt] = useState({ status: "idle", camps: [], errors: {}, sources: [] });
  const m = metaOn(conn) ? conn.meta : null, g = googleOn(conn) ? conn.google : null;
  const per = period ? { since: period.since, until: period.until } : undefined;
  const key = JSON.stringify([enabled, m && [m.accountId, m.token.slice(-8), m.via || "api"], g && [g.slug, g.customerId, g.refreshToken || ""], tick, per]);
  useEffect(() => {
    if (!enabled || (!m && !g)) { setSt({ status: "idle", camps: [], errors: {}, sources: [] }); return; }
    let dead = false;
    setSt(s => ({ ...s, status: "loading", errors: {} }));
    Promise.allSettled([
      m ? apiPost(metaApi(m), { action: "data", account_id: m.accountId, period: per }, { "x-meta-token": m.token }) : Promise.resolve(null),
      g ? apiPost("/api/google", { action: "data", slug: g.slug, customer_id: g.customerId, refresh_token: g.refreshToken || undefined, period: per }) : Promise.resolve(null),
    ]).then(([rm, rg]) => {
      if (dead) return;
      const camps = [], prev = { spend: 0, revenue: 0, purchases: 0, clicks: 0, impr: 0, tracked: 0 }, errors = {}, sources = [];
      [["meta", rm, m], ["google", rg, g]].forEach(([ch, r, c]) => {
        if (!c) return;
        if (r.status === "rejected") { errors[ch] = r.reason.message; return; }
        const v = r.value || {};
        camps.push(...(v.campaigns || []));
        if (v.prev) Object.keys(prev).forEach(k => { prev[k] += v.prev[k] || 0; });
        sources.push({ ch, label: ch === "meta" ? (c.accountName || c.accountId) : (c.customerName || c.customerId), n: (v.campaigns || []).length, note: v.note, lastSpend: v.lastSpend || null, period: v.period || null, idle: v.idleActive || [], days: v.days || null });
      });
      const lastSpend = sources.map(x => x.lastSpend).filter(Boolean).sort().pop() || null;
      const period = (sources.find(x => x.period) || {}).period || null;
      const idle = sources.flatMap(x => x.idle.map(c => ({ ...c, ch: x.ch })));
      // linha do tempo: soma, dia a dia, os canais que mandam a série diária
      const withDays = sources.filter(x => x.days && x.days.length);
      let days = null;
      if (withDays.length) { const by = {}; withDays.forEach(x => x.days.forEach(d => { const o = by[d.d] || (by[d.d] = { d: d.d, spend: 0, impr: 0, clicks: 0, compras: 0, leads: 0, conversas: 0, revenue: 0 }); for (const k in o) if (k !== "d") o[k] += d[k] || 0; })); days = Object.values(by).sort((a, b) => a.d < b.d ? -1 : 1); }
      setSt({ status: sources.length ? "ready" : "error", camps, prev, errors, sources, lastSpend, period, idle, days, dayCh: withDays.map(x => x.ch), at: new Date() });
    });
    return () => { dead = true; };
  }, [key]);
  return { ...st, reload: () => setTick(t => t + 1), hasConn: !!(m || g) };
}

// Saúde da conta a partir dos dados reais: ROAS contra a meta, peso das campanhas abaixo da meta e quedas da semana
function liveHealth(camps, target) {
  const t = totals(camps); const act = camps.filter(c => c.status === "ativa");
  let h = 80;
  if (isFinite(t.roas) && fin(target) && target > 0) h += Math.max(-35, Math.min(15, (t.roas / target - 1) * 40));
  const badSpend = act.filter(c => !c.noRev && roasOf(c) < 1.5).reduce((a, c) => a + c.spend, 0);
  h -= Math.min(20, badSpend / Math.max(1, t.spend) * 60);
  h -= Math.min(10, act.filter(c => c.d7 <= -0.2).length * 3);
  return Math.round(Math.max(25, Math.min(96, h)));
}

function buildLiveInsights(camps) {
  const T = ACTIVE.target, list = [];
  const t = totals(camps);
  const act = camps.filter(c => c.status === "ativa" && c.spend > 0);
  const rev = act.filter(c => !c.noRev);
  const bad = rev.filter(c => roasOf(c) < (T || 1)).sort((a, b) => b.spend - a.spend)[0];
  if (bad) list.push({ id: "l1", sev: roasOf(bad) < 1.5 ? "bad" : "warn", tag: "Atenção", icon: "alert", title: T ? `“${bad.name}” está abaixo da meta de ROAS` : `“${bad.name}” traz menos do que gasta`, body: `${CH[bad.ch].label}: investiu ${brl(bad.spend)} em 30 dias e trouxe ${brl(bad.revenue)}, ROAS de ${xroas(roasOf(bad))}. ${T ? "A meta da conta é " + xroas(T) + "." : "A conta não tem meta de ROAS definida."}`, metric: xroas(roasOf(bad)), ask: `O que faço com a campanha “${bad.name}”?`, goto: "campaigns" });
  const zero = act.filter(c => !c.noRev && c.purchases === 0 && c.spend >= Math.max(200, t.spend * 0.03)).sort((a, b) => b.spend - a.spend)[0];
  if (zero) list.push({ id: "l2", sev: "bad", tag: "Sem conversões", icon: "wallet", title: `“${zero.name}” gastou sem converter`, body: `${CH[zero.ch].label}: ${brl(zero.spend)} investidos em 30 dias sem nenhuma compra ou conversão registrada. Vale conferir a otimização e o rastreamento.`, metric: brl(zero.spend), ask: `Por que a campanha “${zero.name}” não converte?`, goto: "campaigns" });
  const fat = act.filter(c => c.ch === "meta" && c.freq >= 3.5).sort((a, b) => b.freq - a.freq)[0];
  if (fat) list.push({ id: "l3", sev: "warn", tag: "Risco", icon: "eye", title: `Frequência alta em “${fat.name}”`, body: `Frequência de ${dec(fat.freq, 1)} em 30 dias: o mesmo público está vendo o anúncio muitas vezes. A receita da campanha variou ${fat.d7 >= 0 ? "+" : "−"}${pct(Math.abs(fat.d7), 0)} na última semana.`, metric: "freq. " + dec(fat.freq, 1), ask: `Como resolvo a fadiga da campanha “${fat.name}”?`, goto: "campaigns" });
  const drop = act.filter(c => c.d7 <= -0.2 && c !== bad).sort((a, b) => b.spend - a.spend)[0];
  if (drop) list.push({ id: "l4", sev: "warn", tag: "Queda na semana", icon: "down", title: `“${drop.name}” caiu ${pct(-drop.d7, 0)} na semana`, body: `${CH[drop.ch].label}: comparando os últimos 7 dias com os 7 anteriores, ${drop.noRev ? "o investimento" : "a receita"} caiu ${pct(-drop.d7, 0)}.`, metric: "−" + pct(-drop.d7, 0), ask: `Por que a campanha “${drop.name}” caiu esta semana?`, goto: "campaigns" });
  const best = T && rev.filter(c => roasOf(c) >= T * 1.3 && c.spend >= t.spend * 0.03).sort((a, b) => roasOf(b) - roasOf(a))[0];
  if (best) list.push({ id: "l5", sev: "good", tag: "Oportunidade", icon: "up", title: `“${best.name}” tem espaço para escalar`, body: `ROAS de ${xroas(roasOf(best))}, acima da meta de ${xroas(T)}, com ${brl(best.spend)} investidos.${best.budget ? " Orçamento atual de " + brl(best.budget) + "/dia." : ""}`, metric: xroas(roasOf(best)), ask: `Quanto posso escalar a campanha “${best.name}”?`, goto: "campaigns" });
  if (ACTIVE.prev.purchases > 0 && t.purchases > 0) {
    const d = delta(t.cpa, ACTIVE.prev.spend / ACTIVE.prev.purchases);
    list.push({ id: "l6", sev: d <= 0 ? "good" : "warn", tag: "Tendência", icon: "target", title: `CPA ${d <= 0 ? "caiu" : "subiu"} ${pct(Math.abs(d), 0)} no período`, body: `CPA de ${brl2(t.cpa)} contra ${brl2(ACTIVE.prev.spend / ACTIVE.prev.purchases)} nos 30 dias anteriores.`, metric: (d <= 0 ? "−" : "+") + pct(Math.abs(d), 0), ask: d <= 0 ? "O que fez meu CPA cair?" : "Por que meu CPA subiu?", goto: "overview" });
  }
  if (camps.some(c => c.noRev && c.ch === "google")) list.push({ id: "l7", sev: "info", tag: "Google sem receita", icon: "bulb", title: "Google Ads aparece sem ROAS", body: "O conector do Google Ads ainda não informa o valor das conversões, então as campanhas do Google entram no CPA e nas conversões, mas não no ROAS.", metric: "n/d", ask: "Como estão minhas campanhas do Google pelo CPA?", goto: "campaigns" });
  return list;
}

const ddmm = ymd => ymd ? ymd.slice(8, 10) + "/" + ymd.slice(5, 7) : "";
// a conta está parada quando o último gasto é anterior a anteontem (ontem ainda pode estar fechando)
function staleSince(last) {
  if (!last) return null;
  const lim = new Date(); lim.setDate(lim.getDate() - 2);
  const y = lim.getFullYear() + "-" + String(lim.getMonth() + 1).padStart(2, "0") + "-" + String(lim.getDate()).padStart(2, "0");
  return last < y ? ddmm(last) : null;
}

function DataBand({ live, company, go, isLive, periodR, onJump, onPicker }) {
  if (live.status === "loading") return html`<div className="data-band"><span className="spin" aria-hidden="true"></span><span>Buscando as campanhas conectadas…</span></div>`;
  const errs = Object.entries(live.errors || {});

    <span className="band-src">${live.sources.map(s => html`<span key=${s.ch} className="acc-chip"><span className="ch-dot" style=${{ background: CH[s.ch].color }}></span>${CH[s.ch].label} · ${s.label}</span>`)}</span>
    ${errs.length ? html`<span className="band-err">${errs.map(([ch, m]) => CH[ch].label + ": " + m).join(" ")}</span>` : html`${staleSince(live.lastSpend) ? html`<span className="stale-pill" title="Nenhuma campanha gastou desde esta data. Os números do período não mudam até a conta voltar a veicular."><${Icon} n="alert" s=${13} />Sem veiculação desde ${staleSince(live.lastSpend)}</span>` : null}<span className="band-note hide-sm">${periodR.custom ? periodR.dates : periodR.label + " (" + periodR.dates + ")"} · atualizado às ${live.at ? live.at.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : ""}</span>`}
    <button className="btn btn-sm btn-line" onClick=${live.reload}>Atualizar</button></div>`;
  if (errs.length) return html`<div className="data-band err"><${Icon} n="alert" s=${15} /><span style=${{ flex: 1, minWidth: 200 }}>${errs.map(([ch, m]) => html`<span key=${ch} style=${{ display: "block" }}><b>${CH[ch].label}:</b> ${m}</span>`)}<span style=${{ display: "block", color: "var(--muted-2)" }}>Enquanto isso, o painel mostra dados de exemplo.</span></span>
    <button className="btn btn-sm btn-line" onClick=${live.reload}>Tentar de novo</button><button className="btn btn-sm btn-primary" onClick=${() => go("integrations")}>Ver integrações</button></div>`;
  if (live.status === "ready") return html`<${NoDataNotice} live=${live} periodR=${periodR} onJump=${onJump} onPicker=${onPicker} onIntegrations=${() => go("integrations")} />`;
  return html`<div className="data-band demo"><${Icon} n="eye" s=${15} /><span style=${{ flex: 1, minWidth: 200 }}>Você está vendo <b>dados de exemplo</b>. Conecte o Meta Ads ou o Google Ads para ver as campanhas de ${company}.</span><button className="btn btn-sm btn-primary" onClick=${() => go("integrations")}><${Icon} n="plug" s=${14} />Conectar contas</button></div>`;
}

// combo de conta: botão com a conta escolhida que abre uma lista com busca (teclado: ↑ ↓ Enter Esc)
function AccountCombo({ items, value, onChange, label, id }) {
  const [open, setOpen] = useState(false); const [q, setQ] = useState(""); const [hi, setHi] = useState(0);
  const box = useRef(null), inp = useRef(null), listRef = useRef(null);
  const cur = items.find(a => a.id === value);
  const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const shown = items.filter(a => !q || norm(a.name + " " + a.id + " " + (a.sub || "")).includes(norm(q)));
  useEffect(() => { if (open) { setQ(""); setHi(Math.max(0, items.findIndex(a => a.id === value))); setTimeout(() => inp.current && inp.current.focus(), 0); } }, [open]);
  useEffect(() => {
    if (!open) return;
    const off = e => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", off); return () => document.removeEventListener("mousedown", off);
  }, [open]);
  useEffect(() => { const el = listRef.current && listRef.current.querySelector(".hi"); if (el) el.scrollIntoView({ block: "nearest" }); }, [hi, open]);
  const pick = a => { onChange(a.id); setOpen(false); };
  const key = e => {
    if (e.key === "ArrowDown") { e.preventDefault(); setHi(Math.min(shown.length - 1, hi + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setHi(Math.max(0, hi - 1)); }
    else if (e.key === "Enter") { e.preventDefault(); if (shown[hi]) pick(shown[hi]); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); setOpen(false); }
  };
  const row = (a, extra) => html`<span className="ac-main"><b>${a.name}</b><span className="mono">${a.id}${a.sub ? " · " + a.sub : ""}</span></span>${a.pill ? html`<span className=${"pill " + a.pill[0]}>${a.pill[1]}</span>` : null}${extra || null}`;
  return html`<div className=${"ac" + (open ? " open" : "")} ref=${box}>
    <button type="button" id=${id} className="ac-btn" onClick=${() => setOpen(!open)} aria-haspopup="listbox" aria-expanded=${open} aria-label=${label}>
      ${cur ? row(cur) : html`<span className="ac-main"><b className="ac-ph">Escolha a conta</b></span>`}<${Icon} n="chevD" s=${16} /></button>
    ${open ? html`<div className="ac-pop">
      <div className="ac-search"><${Icon} n="search" s=${15} /><input ref=${inp} value=${q} onInput=${e => { setQ(e.target.value); setHi(0); }} onKeyDown=${key} placeholder=${"Buscar entre " + items.length + " contas, por nome ou ID"} aria-label="Buscar conta" role="combobox" aria-expanded="true" aria-controls=${id + "-list"} /></div>
      <div className="ac-list" role="listbox" id=${id + "-list"} ref=${listRef} aria-label=${label}>
        ${shown.length ? shown.map((a, i) => html`<button type="button" key=${a.id} role="option" aria-selected=${a.id === value} className=${"ac-opt" + (i === hi ? " hi" : "") + (a.id === value ? " on" : "")} onMouseEnter=${() => setHi(i)} onClick=${() => pick(a)}>
          ${row(a, a.id === value ? html`<span className="ac-check"><${Icon} n="check" s=${15} /></span>` : html`<span className="ac-check"></span>`)}</button>`) : html`<div className="ac-empty">Nenhuma conta com “${q}”.</div>`}
      </div></div>` : null}
  </div>`;
}

function usePortfolio(client, enabled) {
  const m = enabled && metaOn(client.conn) ? client.conn.meta : null;
  const [tick, setTick] = useState(0);
  const [st, setSt] = useState({ status: "idle", accounts: [] });
  const key = JSON.stringify([m && m.token.slice(-8), m && m.via, tick]);
  useEffect(() => {
    if (!m) { setSt({ status: "idle", accounts: [] }); return; }
    let dead = false;
    setSt(s => ({ ...s, status: "loading", error: null }));
    apiPost(metaApi(m), { action: "portfolio" }, { "x-meta-token": m.token })
      .then(j => { if (!dead) setSt({ status: "ready", accounts: j.accounts || [], truncated: j.truncated, at: new Date() }); })
      .catch(e => { if (!dead) setSt({ status: "error", accounts: [], error: e.message }); });
    return () => { dead = true; };
  }, [key]);
  return { ...st, reload: () => setTick(t => t + 1) };
}

// Transforma cada conta de anúncio numa linha da carteira, no mesmo formato da carteira de exemplo
function livePortfolioRows(accounts, target) {
  const BLOCK = { 2: "Conta desativada", 3: "Pagamento pendente: entrega parada", 7: "Conta em análise pela Meta", 8: "Pagamento pendente: entrega parada", 9: "Período de carência do pagamento", 100: "Encerramento pendente", 101: "Conta encerrada" };
  return accounts.map(a => {
    const m = a.m30, w1 = a.w1, w0 = a.w0;
    const tracked = m.revenue > 0 ? m.spend : 0;
    const t = { spend: m.spend, revenue: m.revenue, purchases: m.purchases, clicks: m.clicks, impr: m.impr, tracked, roas: m.revenue / tracked, cpa: m.spend / m.purchases, ctr: m.clicks / m.impr, ticket: m.revenue / m.purchases };
    const issues = [];
    if (a.status !== 1) issues.push({ t: "block", ch: "meta", text: (BLOCK[a.status] || "Conta com restrição") + (a.reason ? " (" + a.reason + ")" : ""), act: "Ver conta", go: "overview" });
    const r7 = w1.revenue / w1.spend;
    let waste7 = 0;
    if (a.status === 1 && m.revenue > 0 && w1.spend >= 300 && r7 < 1.5) { waste7 = w1.spend; issues.push({ t: "waste", ch: "meta", text: "ROAS de " + xroas(r7) + " nos últimos 7 dias: " + brl(w1.spend) + " investidos", act: "Ver campanhas", go: "campaigns" }); }
    if (a.status === 1 && m.purchases > 0 && w1.spend >= 100 && w1.purchases === 0) issues.push({ t: "track", ch: "meta", text: "Nenhuma conversão registrada em 7 dias, com " + brl(w1.spend) + " de gasto", act: "Ver visão geral", go: "overview" });
    if (a.status === 1 && target && t.roas >= target * 1.5 && w1.spend > 0 && (!w1.revenue || r7 >= target)) issues.push({ t: "opp", ch: "meta", text: "ROAS de " + xroas(t.roas) + " em 30 dias, bem acima da meta", act: "Escalar", go: "campaigns" });
    const base7 = m.revenue > 0 ? [w1.revenue, w0.revenue] : [w1.spend, w0.spend];
    const d7 = base7[1] > 0 ? (base7[0] - base7[1]) / base7[1] : 0;
    issues.sort((x, y) => ISSUE[x.t].rank - ISSUE[y.t].rank);
    let health = m.spend > 0 ? 96 - issues.reduce((s, i) => s + ISSUE[i.t].w, 0) : 60;
    if (fin(t.roas) && t.roas < target) health -= Math.round((target - t.roas) / target * 40);
    if (a.status !== 1) health = Math.min(health, 40);
    health = Math.max(25, Math.min(96, health));
    const seg = [a.business || "Meta Ads", m.spend > 0 ? null : "sem gasto em 30 dias"].filter(Boolean).join(" · ");
    return { id: a.id, name: a.name, seg, target, budget: NaN, spent: a.month, chs: ["meta"], d7, issues, t, pace: NaN, over: 0, health, waste7, live: true, status: a.status,
      accounts: [{ ch: "meta", id: a.id, parent: a.business || "acesso direto do token", issue: issues.find(i => i.t === "block" || i.t === "track") }],
      yday: a.yday, dayBudget: NaN };
  });
}

/* ================= dados no servidor (banco + e-mail) ================= */
// No boot o app pergunta ao servidor se há banco. Com banco, clientes, senhas, convites e conexões ficam no servidor
// e valem em qualquer computador. Sem banco (ou fora da Vercel), tudo fica neste navegador, como na demonstração.
let SERVER = { mode: "local", db: false, email: false };
const SESSION_KEY = "readyai_session_v1";
async function srv(path, body, token) {
  let r;
  try { r = await fetch(path, { method: "POST", headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) }, body: JSON.stringify(body) }); }
  catch (e) { throw new Error("Sem conexão com o servidor. Confira sua internet e tente de novo."); }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || "Falha no servidor (" + r.status + ")."); err.code = j.code; err.status = r.status; throw err; }
  return j;
}
// datas do servidor chegam em ISO; as da demonstração já vêm como texto ("hoje, 08:41")
function fmtWhen(v) {
  if (!v) return "nunca";
  if (!/^\d{4}-\d{2}-\d{2}T/.test(v)) return v;
  const d = new Date(v), now = new Date();
  const hm = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return "hoje, " + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "ontem, " + hm;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", "") + ", " + hm;
}
const fmtDay = v => v ? new Date(v).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
function copyText(txt, toast, ok) {
  try { navigator.clipboard.writeText(txt).then(() => toast(ok), () => toast("Selecione o texto e copie")); } catch (e) { toast("Selecione o texto e copie"); }
}

          <ul>${visibleMods.map(m => html`<li key=${m.key} className=${p.modules.includes(m.key) ? "" : "off"}><span style=${{ color: p.modules.includes(m.key) ? "var(--good)" : "var(--muted)" }}><${Icon} n=${p.modules.includes(m.key) ? "check" : "x"} s=${14} /></span>${m.label}</li>`)}</ul>
          <div className="card-sub">${clients.filter(c => c.plan === k).length} clientes neste plano</div></div>`)}</div>
        <div className="card card-pad"><div className="card-head"><div><div className="card-title">Catálogo de módulos</div><div className="card-sub">Cada módulo vira um item de menu na plataforma do cliente. Módulos ocultos não aparecem para ninguém.</div></div></div>
          <div>${MODULES.map(m => html`<div key=${m.key} className="mod-row"><div><b>${m.label} <span style=${{ fontWeight: 400, color: "var(--muted)", fontSize: 12 }}>· ${m.group}</span></b><small>${m.desc}</small></div>
            ${m.hidden ? html`<span className="pill pill-violet">Oculto · em breve</span>` : m.core ? html`<span className="pill pill-mute">Base de todos os planos</span>` : html`<span className="mono" style=${{ color: "var(--muted)" }}>${m.key}</span>`}</div>`)}</div></div>
      </div>`}
    </div>
    ${cur ? html`<${ClientDrawer} c=${cur} upd=${upd} api=${api} inviteRes=${inviteRes[cur.id]} setInviteRes=${r => setInviteRes(x => ({ ...x, [cur.id]: r }))} onClose=${() => setSel(null)} onImpersonate=${onImpersonate} onDelete=${() => remove(cur)} busy=${busy} toast=${toast} visibleMods=${visibleMods} />` : null}
    ${adding ? html`<${NewClient} server=${api.server} onClose=${() => setAdding(false)} onCreate=${async f => {
      const r = await api.create(f);
      setAdding(false); setSel(r.client.id);
      if (r.invite) setInviteRes(x => ({ ...x, [r.client.id]: r.invite }));
      toast(!api.server ? "Cliente criado. Envie a senha temporária para " + r.client.email : r.invite && r.invite.sent ? "Convite enviado para " + r.client.email : "Cliente criado, mas o e-mail não saiu. Copie o link do convite.");
    }} />` : null}
    ${toastMsg ? html`<div className="toast" role="status">${toastMsg}</div>` : null}
  </div>`;
}

// responsável pela conta e acessos extras (cada um entra com o próprio e-mail e senha)
function PeopleSection({ c, api, toast }) {
  const [edit, setEdit] = useState(null); // "owner" | id do acesso | "new"
  const [f, setF] = useState({ name: "", email: "" });
  const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const [links, setLinks] = useState({}); const [secrets, setSecrets] = useState({}); const [confirmRm, setConfirmRm] = useState(null);
  useEffect(() => { setEdit(null); setErr(""); setLinks({}); setSecrets({}); setConfirmRm(null); }, [c.id]);
  const users = c.users || [];
  const open = (who, name, email) => { setEdit(who); setF({ name: name || "", email: email || "" }); setErr(""); };
  const valid = f.name.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim());
  // devolve { ok, r }: ok=false quando o servidor recusou (o erro aparece no formulário)
  const run = async (fn, ok) => { setBusy(true); setErr(""); try { const r = await fn(); if (ok) toast(typeof ok === "function" ? ok(r) : ok); return { ok: true, r }; } catch (e) { setErr(e.message); return { ok: false }; } finally { setBusy(false); } };
  const save = async e => {
    e.preventDefault(); if (!valid || busy) return;
    const data = { name: f.name.trim(), email: f.email.trim().toLowerCase() };
    if (edit === "owner") { const x = await run(() => api.update(c.id, data), "Responsável atualizado"); if (x.ok) setEdit(null); }
    else if (edit === "new") { const x = await run(() => api.addUser(c.id, data)); const r = x.r; if (x.ok && r) { setEdit(null); if (r.invite) { setLinks(x => ({ ...x, [r.userId]: r.invite.link })); toast(r.invite.sent ? "Convite enviado para " + data.email : "Acesso criado, mas o e-mail não saiu. Copie o link do convite."); } else if (r.password) { setSecrets(x => ({ ...x, [r.userId]: r.password })); toast("Acesso criado"); } } }
    else { const x = await run(() => api.updateUser(c.id, edit, data), "Acesso atualizado"); if (x.ok) setEdit(null); }
  };
  const form = (title, cta) => html`<form className="ppl-form" onSubmit=${save}>
    <b>${title}</b>
    <div className="grid g2"><div className="field"><label htmlFor="pp-n">Nome</label><input id="pp-n" className="input" value=${f.name} onInput=${e => setF({ ...f, name: e.target.value })} autoFocus /></div>
      <div className="field"><label htmlFor="pp-e">E-mail de login</label><input id="pp-e" type="email" className="input" value=${f.email} onInput=${e => setF({ ...f, email: e.target.value })} /></div></div>
    ${edit === "owner" && f.email.trim().toLowerCase() !== c.email.toLowerCase() ? html`<span className="card-sub">O login passa a ser o novo e-mail. ${c.hasPassword ? "A senha continua a mesma." : "O convite pendente continua valendo."}</span>` : null}
    ${err ? html`<div className="err" role="alert">${err}</div>` : null}
    <div className="msg-actions"><button className="btn btn-sm btn-primary" type="submit" disabled=${!valid || busy}>${busy ? "Salvando…" : cta}</button><button className="btn btn-sm btn-line" type="button" onClick=${() => setEdit(null)}>Cancelar</button></div>
  </form>`;
  const status = u => u.hasPassword || (u.invite && u.invite.acceptedAt) || u.password ? html`<span className="pill pill-good"><span className="dot"></span>${u.lastAccess && u.lastAccess !== "nunca" ? "Último acesso " + (/^\d{4}-/.test(u.lastAccess) ? fmtWhen(u.lastAccess) : u.lastAccess) : "Ativo"}</span>`
    : u.invite && u.invite.emailError ? html`<span className="pill pill-bad">E-mail não enviado</span>` : html`<span className="pill pill-warn">Convite enviado</span>`;
  return html`<section className="stack" style=${{ gap: 10 }}><div className="eyebrow">Responsável e acessos</div>
    ${edit === "owner" ? form("Editar responsável pela conta", "Salvar") : html`<div className="ppl-row"><span className="ppl-av">${(c.name || "?")[0]}</span><div><b>${c.name} <span className="pill pill-info" style=${{ height: 18, fontSize: 10.5 }}>Responsável</span></b><small>${c.email}</small></div>
      <button className="btn btn-sm btn-ghost" onClick=${() => open("owner", c.name, c.email)} aria-label="Editar responsável"><${Icon} n="edit" s=${14} />Editar</button></div>`}
    ${users.map(u => edit === u.id ? html`<div key=${u.id}>${form("Editar acesso", "Salvar")}</div>` : html`<div key=${u.id} className="ppl-row ppl-extra"><span className="ppl-av">${(u.name || "?")[0]}</span>
      <div style=${{ minWidth: 0 }}><b>${u.name}</b><small>${u.email}</small><div style=${{ marginTop: 4 }}>${status(u)}</div>
        ${links[u.id] ? html`<div style=${{ display: "flex", gap: 6, marginTop: 8 }}><input className="input mono" style=${{ fontSize: 11.5, height: 32 }} readOnly value=${links[u.id]} onFocus=${e => e.target.select()} aria-label="Link do convite" /><button className="btn btn-sm btn-line" onClick=${() => copyText(links[u.id], toast, "Link copiado")}><${Icon} n="copy" s=${13} />Copiar</button></div>` : null}
        ${secrets[u.id] ? html`<div className="secret" style=${{ marginTop: 8 }}><span>Senha temporária:</span><code>${secrets[u.id]}</code><button className="btn btn-sm btn-line" onClick=${() => copyText(secrets[u.id], toast, "Senha copiada")}><${Icon} n="copy" s=${13} />Copiar</button></div>` : null}
        ${confirmRm === u.id ? html`<div className="msg-actions" style=${{ marginTop: 8 }}><span className="card-sub" style=${{ flexBasis: "100%" }}>Remover o acesso de ${u.email}? A pessoa deixa de entrar na plataforma.</span><button className="btn btn-sm btn-danger" disabled=${busy} onClick=${async () => { const x = await run(() => api.removeUser(c.id, u.id), "Acesso removido"); if (x.ok) setConfirmRm(null); }}>Remover</button><button className="btn btn-sm btn-line" onClick=${() => setConfirmRm(null)}>Cancelar</button></div>` : null}
      </div>
      <div className="ppl-acts">
        ${api.server && !u.hasPassword && !(u.invite && u.invite.acceptedAt) ? html`<button className="btn btn-sm btn-ghost" title="Reenviar convite" disabled=${busy} onClick=${async () => { const x = await run(() => api.resendUser(c.id, u.id), r => r.invite.sent ? "Convite reenviado para " + u.email : "Novo link criado, mas o e-mail não saiu. Copie o link."); if (x.ok) setLinks(l => ({ ...l, [u.id]: x.r.invite.link })); }}><${Icon} n="refresh" s=${14} /></button>` : null}
        <button className="btn btn-sm btn-ghost" title="Gerar senha temporária" disabled=${busy} onClick=${async () => { const x = await run(() => api.resetUserPassword(c.id, u.id)); if (x.ok) setSecrets(l => ({ ...l, [u.id]: x.r })); }}><${Icon} n="key" s=${14} /></button>
        <button className="btn btn-sm btn-ghost" title="Editar" onClick=${() => open(u.id, u.name, u.email)}><${Icon} n="edit" s=${14} /></button>
        <button className="btn btn-sm btn-ghost" title="Remover acesso" onClick=${() => setConfirmRm(u.id)}><${Icon} n="trash" s=${14} /></button>
      </div></div>`)}
    ${edit === "new" ? form("Novo acesso", api.server ? "Enviar convite" : "Criar acesso")
      : users.length < 5 ? html`<div><button className="btn btn-sm btn-line" onClick=${() => open("new")}><${Icon} n="plus" s=${14} />Adicionar acesso</button></div>` : null}
    <span className="card-sub">Cada acesso entra com o próprio e-mail e senha e vê os mesmos dados de ${c.company}. ${api.server ? "A pessoa recebe um convite por e-mail para criar a senha." : "Uma senha temporária é gerada ao criar."}</span>
    ${err && !edit ? html`<div className="err" role="alert">${err}</div>` : null}
  </section>`;
}

    </aside><//>`;

function NewClient({ onClose, onCreate, server }) {
  const [f, setF] = useState({ company: "", name: "", email: "", plan: "pro", targetRoas: "" }); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);

    const rawT = String(f.targetRoas).trim(); const tr = parseFloat(rawT.replace(",", "."));
    if (rawT && !(tr > 0 && tr < 100)) { setErr("A meta de ROAS precisa ser um número entre 0,1 e 99, ou ficar em branco."); return; }
    setBusy(true); setErr("");
    try { await onCreate({ company: f.company.trim(), name: f.name.trim(), email: f.email.trim().toLowerCase(), plan: f.plan, targetRoas: rawT ? Math.round(tr * 100) / 100 : null, modules: [...PLANS[f.plan].modules] }); }
    catch (e2) { setErr(e2.message); setBusy(false); }
  };
  return html`<${Fragment}><div className="drawer-bg" onClick=${onClose}></div>
    <aside className="drawer" role="dialog" aria-label="Novo cliente"><form onSubmit=${submit} style=${{ display: "flex", flexDirection: "column", height: "100%" }}>

      <div className="drawer-body">
        <div className="field"><label htmlFor="nc-co">Empresa</label><input id="nc-co" className="input" value=${f.company} onInput=${set("company")} placeholder="Ex.: Ótica Lumière" /></div>
        <div className="field"><label htmlFor="nc-n">Gestor de marketing</label><input id="nc-n" className="input" value=${f.name} onInput=${set("name")} placeholder="Nome completo" /></div>
        <div className="field"><label htmlFor="nc-e">E-mail de login</label><input id="nc-e" type="email" className="input" value=${f.email} onInput=${set("email")} placeholder="nome@empresa.com.br" />${server ? html`<span className="card-sub">O convite vai para este e-mail.</span>` : null}</div>
        <div className="field"><label htmlFor="nc-roas">Meta de ROAS <span style=${{ fontWeight: 500, color: "var(--muted)" }}>(opcional)</span></label><input id="nc-roas" className="input num" inputMode="decimal" style=${{ maxWidth: 140 }} value=${f.targetRoas} onInput=${set("targetRoas")} placeholder="Ex.: 3" /><span className="card-sub">Pode ficar em branco e ser definida depois em Integrações.</span></div>
        <div className="field"><label htmlFor="nc-p">Plano</label><select id="nc-p" className="input" value=${f.plan} onChange=${set("plan")}>${Object.entries(PLANS).map(([k, p]) => html`<option key=${k} value=${k}>${p.name} · ${brl(p.price)}/mês</option>`)}</select></div>
        ${err ? html`<div className="err" role="alert">${err}</div>` : null}
      </div>

}

// auth(email, senha) faz o login (no servidor ou neste navegador) e lança um erro com a mensagem para a pessoa
function Login({ auth, showDemo, notice }) {
  const [email, setEmail] = useState(""); const [pass, setPass] = useState(""); const [err, setErr] = useState(""); const [showPass, setShowPass] = useState(false); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault(); if (busy) return; setErr(""); setBusy(true);
    try { await auth(email.trim().toLowerCase(), pass); } catch (x) { setErr(x.message); setBusy(false); }
  };
  const fill = (e, p) => { setEmail(e); setPass(p); setErr(""); };
  return html`<div className="login">
    <${LoginSide} />
    <section className="login-main" style=${{ position: "relative" }}><span style=${{ position: "absolute", top: 16, right: "max(16px, env(safe-area-inset-right, 0px))" }}><${ThemeToggle} withLabel /></span><form className="login-box" onSubmit=${submit}>
      <div><h2>Entrar</h2><p style=${{ color: "var(--muted)", marginTop: 4 }}>${showDemo ? "Use o e-mail e a senha enviados pelo seu gestor de conta." : "Use o e-mail do convite e a senha que você criou."}</p></div>
      ${notice ? html`<div className="notice info" style=${{ padding: "10px 12px" }}><${Icon} n="check" s=${15} /><span>${notice}</span></div>` : null}
      <div className="field"><label htmlFor="lg-e">E-mail</label><input id="lg-e" className="input" type="email" autoComplete="username" value=${email} onInput=${e => setEmail(e.target.value)} placeholder="voce@empresa.com.br" /></div>
      <div className="field"><label htmlFor="lg-p">Senha</label><div className="pass-wrap"><input id="lg-p" className="input" type=${showPass ? "text" : "password"} autoComplete="current-password" value=${pass} onInput=${e => setPass(e.target.value)} placeholder="••••••••" />
        <button type="button" className="pass-eye" onClick=${() => setShowPass(v => !v)} aria-label=${showPass ? "Ocultar senha" : "Mostrar senha"} aria-pressed=${showPass} title=${showPass ? "Ocultar senha" : "Mostrar senha"}><${Icon} n=${showPass ? "eyeOff" : "eye"} s=${17} /></button></div></div>
      ${err ? html`<div className="err" role="alert">${err}</div>` : null}
      <button className="btn btn-primary" style=${{ height: 42 }} type="submit" disabled=${busy}>${busy ? "Entrando…" : "Entrar"}</button>
      ${showDemo ? html`<div className="demo-creds"><div className="eyebrow">Acessos da demonstração</div>
        ${[["camila@lojaaurora.com.br", "demo123", "Loja Aurora", "Plano Pro"], ["rafael@nortex.com.br", "demo123", "Grupo Nortex", "Plano Scale, com todos os módulos"], ["marina@studiovitta.com.br", "demo123", "Studio Vitta", "Plano Starter, com módulos bloqueados"]].map(([e, p, l, d]) => html`<button key=${e} type="button" className="cred" onClick=${() => fill(e, p)}><span><b style=${{ fontSize: 13 }}>${l}</b><small>${d}</small></span><span className="mono" style=${{ color: "var(--muted)" }}>${p}</span></button>`)}
      </div>` : null}
    </form></section>
  </div>`;
}

/* ================= aceite do convite (link do e-mail) ================= */
function InviteAccept({ token, onAccepted, onLeave }) {
  const [info, setInfo] = useState(null); const [err, setErr] = useState(null);
  const [p1, setP1] = useState(""); const [p2, setP2] = useState(""); const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false); const [ferr, setFerr] = useState("");
  useEffect(() => {
    if (SERVER.mode !== "server") { setErr("Este link de convite precisa do servidor da ReadyAI. Abra-o pelo endereço publicado do app."); return; }
    srv("/api/auth", { action: "invite_info", token }).then(setInfo).catch(e => setErr(e.message));
  }, []);
  const submit = async e => {
    e.preventDefault(); if (busy) return; setFerr("");
    if (p1.length < 8) return setFerr("A senha precisa ter pelo menos 8 caracteres.");
    if (p1 !== p2) return setFerr("As duas senhas não são iguais.");
    setBusy(true);
    try { const j = await srv("/api/auth", { action: "accept", token, password: p1 }); onAccepted(j); }
    catch (x) { setFerr(x.message); setBusy(false); }
  };
  const first = info ? String(info.name || "").split(" ")[0] : "";
  return html`<div className="login">
    <${LoginSide} />
    <section className="login-main" style=${{ position: "relative" }}><span style=${{ position: "absolute", top: 16, right: "max(16px, env(safe-area-inset-right, 0px))" }}><${ThemeToggle} withLabel /></span>
      ${err ? html`<div className="login-box"><div><div className="eyebrow">Convite</div><h2>Convite indisponível</h2></div><div className="err" role="alert">${err}</div><button className="btn btn-primary" style=${{ height: 42 }} onClick=${onLeave}>Ir para o login</button></div>`
      : !info ? html`<div className="login-box"><div style=${{ display: "flex", alignItems: "center", gap: 10, color: "var(--muted)" }}><span className="spin" aria-hidden="true"></span>Abrindo seu convite…</div></div>`
      : html`<form className="login-box" onSubmit=${submit}>
        <div><div className="eyebrow">Convite · ${info.company}</div><h2>Crie sua senha</h2><p style=${{ color: "var(--muted)", marginTop: 4 }}>${first ? first + ", você" : "Você"} vai acessar a ReadyAI como <b style=${{ color: "var(--ink)" }}>${info.company}</b>, no plano ${info.plan}.</p></div>
        <div className="field"><label htmlFor="iv-e">E-mail de login</label><input id="iv-e" className="input" type="email" autoComplete="username" value=${info.email} readOnly /></div>
        <div className="field"><label htmlFor="iv-p1">Nova senha</label><div className="pass-wrap"><input id="iv-p1" className="input" type=${show ? "text" : "password"} autoComplete="new-password" value=${p1} onInput=${e => setP1(e.target.value)} placeholder="Pelo menos 8 caracteres" />
          <button type="button" className="pass-eye" onClick=${() => setShow(v => !v)} aria-label=${show ? "Ocultar senha" : "Mostrar senha"} aria-pressed=${show}><${Icon} n=${show ? "eyeOff" : "eye"} s=${17} /></button></div></div>
        <div className="field"><label htmlFor="iv-p2">Confirme a senha</label><input id="iv-p2" className="input" type=${show ? "text" : "password"} autoComplete="new-password" value=${p2} onInput=${e => setP2(e.target.value)} /></div>
        ${ferr ? html`<div className="err" role="alert">${ferr}</div>` : null}
        <button className="btn btn-primary" style=${{ height: 42 }} type="submit" disabled=${busy}>${busy ? "Criando acesso…" : "Aceitar convite e entrar"}</button>
        <p className="card-sub">Depois de entrar, conecte o Meta Ads e o Google Ads em Integrações para ver suas campanhas.</p>
      </form>`}
    </section>
  </div>`;
}

/* ================= raiz ================= */
const KEY = "readyai_demo_v3";
function App() {
  const [ready, setReady] = useState(false);
  const [invite, setInvite] = useState(() => { try { return new URLSearchParams(location.search).get("convite"); } catch (e) { return null; } });
  const [accepted, setAccepted] = useState(null);
  useEffect(() => {
    srv("/api/auth", { action: "status" })
      .then(j => { SERVER = { mode: j.db ? "server" : "local", db: !!j.db, email: !!j.email }; })
      .catch(() => { SERVER = { mode: "local", db: false, email: false }; })
      .finally(() => setReady(true));
  }, []);
  const clearInvite = () => { try { history.replaceState(null, "", location.pathname); } catch (e) {} setInvite(null); };
  if (!ready) return html`<div className="boot">Carregando ReadyAI…</div>`;
  if (invite) return html`<${InviteAccept} token=${invite} onLeave=${clearInvite} onAccepted=${j => { store.set(SESSION_KEY, { token: j.token, role: "client", clientId: j.client.id }); setAccepted(j.client); clearInvite(); }} />`;
  return SERVER.mode === "server" ? html`<${ServerApp} welcome=${accepted} />` : html`<${LocalApp} />`;
}

// ---------- modo com banco: tudo passa pelo servidor ----------
function ServerApp({ welcome }) {
  const [sess, setSessS] = useState(() => store.get(SESSION_KEY, null));
  const setSess = v => { setSessS(v); if (v) store.set(SESSION_KEY, v); else { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} } };
  const [clients, setClients] = useState(welcome ? [welcome] : []);
  const [admin, setAdmin] = useState(null);
  const [phase, setPhase] = useState(sess && !welcome ? "loading" : "ready");
  const [notice, setNotice] = useState(null);
  const tok = () => (store.get(SESSION_KEY, null) || {}).token;
  const call = (path, body) => srv(path, body, tok()).catch(e => { if (e.code === "no_session" || e.status === 401 && path === "/api/auth") { setSess(null); setNotice(e.message); } throw e; });
  const loadList = async () => { const j = await call("/api/clients", { action: "list" }); setClients(j.clients); return j.clients; };
  useEffect(() => {
    if (!sess || welcome) return;
    call("/api/auth", { action: "me" }).then(async j => {
      if (j.role === "admin") { setAdmin(j.admin); await loadList(); } else setClients([j.client]);
      setPhase("ready");
    }).catch(e => { setSess(null); setNotice(e.code === "no_session" ? e.message : null); setPhase("ready"); });
  }, []);
  // "abrir direto em Integrações" vale só na entrada
  useEffect(() => { if (sess && sess.to) setSess({ ...sess, to: null }); }, [sess && sess.to]);
  const auth = async (email, password) => {
    const j = await srv("/api/auth", { action: "login", email, password });
    setSess({ token: j.token, role: j.role, clientId: j.client ? j.client.id : null }); setNotice(null);
    if (j.role === "admin") { setAdmin(j.admin); setPhase("loading"); try { await loadList(); } finally { setPhase("ready"); } }
    else setClients([j.client]);
  };
  const replace = c => setClients(cs => cs.some(x => x.id === c.id) ? cs.map(x => x.id === c.id ? c : x) : [c, ...cs]);
  const legacy = useMemo(() => { const s = store.get(KEY, null); return s && Array.isArray(s.clients) ? s.clients : []; }, []);
  const api = {
    server: true, email: SERVER.email, refresh: loadList, legacy,
    create: async f => { const j = await call("/api/clients", { action: "create", client: f }); replace(j.client); return j; },
    update: async (id, patch) => {
      setClients(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c));
      try { const j = await call("/api/clients", { action: "update", id, patch }); replace(j.client); }
      catch (e) { loadList().catch(() => {}); throw e; }
    },
    remove: async id => { await call("/api/clients", { action: "delete", id }); setClients(cs => cs.filter(c => c.id !== id)); },
    resend: async id => { const j = await call("/api/clients", { action: "resend", id }); replace(j.client); return j; },
    resetPassword: async id => { const j = await call("/api/clients", { action: "reset_password", id }); replace(j.client); return j.password; },
    addUser: async (id, user) => { const j = await call("/api/clients", { action: "add_user", id, user }); replace(j.client); const nu = (j.client.users || []).find(u => u.email === user.email); return { ...j, userId: nu && nu.id }; },
    updateUser: async (id, userId, patch) => { const j = await call("/api/clients", { action: "update_user", id, userId, patch }); replace(j.client); return j; },
    resendUser: async (id, userId) => { const j = await call("/api/clients", { action: "resend_user", id, userId }); replace(j.client); return j; },
    resetUserPassword: async (id, userId) => { const j = await call("/api/clients", { action: "reset_user_password", id, userId }); replace(j.client); return j.password; },
    removeUser: async (id, userId) => { const j = await call("/api/clients", { action: "remove_user", id, userId }); replace(j.client); return j; },
    importLegacy: async list => { const j = await call("/api/clients", { action: "import", clients: list }); setClients(j.clients); return j; },
  };
  const logout = () => { setSess(null); setClients([]); setAdmin(null); };
  if (phase === "loading") return html`<div className="boot">Carregando ReadyAI…</div>`;
  if (!sess) return html`<${Login} auth=${auth} showDemo=${false} notice=${notice} />`;
  const asGone = sess.as && !clients.some(c => c.id === sess.as); // cliente excluído enquanto estava aberto
  if (sess.role === "admin" && (!sess.as || asGone)) return html`<${AdminConsole} clients=${clients} api=${api} adminName=${admin ? admin.name : "Gestora"} onLogout=${logout} onImpersonate=${(id, to) => setSess({ ...sess, as: id, to })} />`;
  const cid = sess.as || sess.clientId; const client = clients.find(c => c.id === cid);
  if (!client) return html`<${Login} auth=${auth} showDemo=${false} notice=${notice} />`;
  const onUpdate = patch => {
    setClients(cs => cs.map(c => c.id === client.id ? { ...c, ...patch } : c));
    const p = sess.role === "admin" ? call("/api/clients", { action: "update", id: client.id, patch }) : call("/api/clients", { action: "self_update", patch });
    p.then(j => replace(j.client)).catch(() => {});
  };
  return html`<${ClientApp} key=${client.id + client.modules.join()} client=${client} onLogout=${logout} impersonating=${!!sess.as} onBackToConsole=${() => setSess({ ...sess, as: null, to: null })} onUpdate=${onUpdate} startScreen=${sess.to} />`;
}

// ---------- modo local (sem banco): tudo neste navegador, como na demonstração ----------
function LocalApp() {
  const saved = store.get(KEY, null);
  const [clients, setClients] = useState(saved && saved.clients ? saved.clients : SEED_CLIENTS);
  const [session, setSession] = useState(saved && saved.session ? saved.session : null);
  useEffect(() => store.set(KEY, { clients, session }), [clients, session]);
  useEffect(() => { if (session && session.to) setSession(x => { const n = { ...x }; delete n.to; return n; }); }, [session && session.to]);
  const auth = async (email, pass) => {
    if (email === ADMIN.email) { let ok = false; try { ok = (await sha256(pass)) === ADMIN.passHash; } catch (x) {} if (ok) return setSession({ role: "admin" }); throw new Error("E-mail ou senha incorretos. Confira os dados e tente de novo."); }
    const c = clients.find(x => x.email.toLowerCase() === email || (x.users || []).some(u => u.email.toLowerCase() === email && u.password === pass));
    const okPass = c && (c.email.toLowerCase() === email ? c.password === pass : true);
    if (!c || !okPass) throw new Error("E-mail ou senha incorretos. Confira os dados e tente de novo.");
    if (c.status === "suspenso") throw new Error("Seu acesso está suspenso. Fale com comercial@readyai.com para reativar.");
    setSession({ role: "client", clientId: c.id });
    setClients(cs => cs.map(x => x.id === c.id ? { ...x, lastAccess: "agora", status: x.status === "convite" ? "ativo" : x.status } : x));
  };
  const api = {
    server: false, email: false,
    create: async f => {
      if (clients.some(c => c.email.toLowerCase() === f.email)) throw new Error("Já existe um cliente com esse e-mail.");
      const p = tempPass();
      const c = { id: "cl" + Date.now(), ...f, conn: {}, password: p, newPass: p, status: "convite", since: new Date().toISOString().slice(0, 10), lastAccess: "nunca", accounts: 0 };
      setClients(cs => [c, ...cs]); return { client: c };
    },
    update: async (id, patch) => setClients(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c)),
    remove: async id => setClients(cs => cs.filter(c => c.id !== id)),
    resetPassword: async id => { const p = tempPass(); setClients(cs => cs.map(c => c.id === id ? { ...c, password: p, newPass: p } : c)); return p; },
    // acessos extras no modo local: senha temporária em vez de convite
    addUser: async (id, user) => {
      const used = e => clients.some(c => c.email.toLowerCase() === e || (c.users || []).some(u => u.email.toLowerCase() === e));
      if (used(user.email)) throw new Error("Esse e-mail já tem acesso.");
      const p = tempPass(), u = { id: "u" + Date.now(), ...user, password: p, lastAccess: "nunca" };
      setClients(cs => cs.map(c => c.id === id ? { ...c, users: [...(c.users || []), u] } : c)); return { userId: u.id, password: p };
    },
    updateUser: async (id, userId, patch) => setClients(cs => cs.map(c => c.id === id ? { ...c, users: (c.users || []).map(u => u.id === userId ? { ...u, ...patch } : u) } : c)),
    resetUserPassword: async (id, userId) => { const p = tempPass(); setClients(cs => cs.map(c => c.id === id ? { ...c, users: (c.users || []).map(u => u.id === userId ? { ...u, password: p } : u) } : c)); return p; },
    removeUser: async (id, userId) => setClients(cs => cs.map(c => c.id === id ? { ...c, users: (c.users || []).filter(u => u.id !== userId) } : c)),
  };
  if (!session) return html`<${Login} auth=${auth} showDemo=${true} />`;
  const logout = () => setSession(null);
  if (session.role === "admin" && !session.as) return html`<${AdminConsole} clients=${clients} api=${api} adminName=${ADMIN.name} onLogout=${logout} onImpersonate=${(id, to) => setSession({ ...session, as: id, to })} />`;
  const cid = session.as || session.clientId; const client = clients.find(c => c.id === cid);
  if (!client) return html`<${Login} auth=${auth} showDemo=${true} />`;
  const onUpdate = patch => setClients(cs => cs.map(c => c.id === client.id ? { ...c, ...patch } : c));
  return html`<${ClientApp} key=${client.id + client.modules.join()} client=${client} onLogout=${logout} impersonating=${!!session.as} onBackToConsole=${() => setSession({ role: "admin" })} onUpdate=${onUpdate} startScreen=${session.to} />`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
